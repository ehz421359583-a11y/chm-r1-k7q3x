<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>ARRIVE-CHM 函询表</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<style>
/* Layout concept: a calm reading desk. Overview = map of the 32 items + the two source tables;
   item page = ARRIVE context -> highlighted TCM requirement -> small supporting notes,
   with the scoring panel pinned beside it (desktop) or below it (phone). Jade ink on cool paper. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E8EFEB; --ink:#14211C; --muted:#4F5F58; --faint:#7A8A83;
  --line:#D5DFD9; --line-strong:#B4C4BB;
  --accent:#1A6853; --accent-hover:#124F3F; --accent-soft:#DAECE3; --on-accent:#FFFFFF;
  --set-e:#1A6853; --set-r:#37579A; --set-x:#8F6118;
  --set-e-soft:#DAECE3; --set-r-soft:#E0E8F6; --set-x-soft:#F4E6CE;
  --focus:#2A8C74; --danger:#A33A2A;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --surface-2:#1D2B26; --ink:#E5EEEA; --muted:#A3B3AC; --faint:#7F918A;
    --line:#26362F; --line-strong:#3B4F46;
    --accent:#58C0A1; --accent-hover:#7AD2B7; --accent-soft:#18372E; --on-accent:#08201A;
    --set-e:#58C0A1; --set-r:#8FA9E2; --set-x:#DDAE55;
    --set-e-soft:#18372E; --set-r-soft:#1C2A47; --set-x-soft:#3A2D14;
    --focus:#7AD2B7; --danger:#E58A78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface-2:#1D2B26; --ink:#E5EEEA; --muted:#A3B3AC; --faint:#7F918A;
  --line:#26362F; --line-strong:#3B4F46;
  --accent:#58C0A1; --accent-hover:#7AD2B7; --accent-soft:#18372E; --on-accent:#08201A;
  --set-e:#58C0A1; --set-r:#8FA9E2; --set-x:#DDAE55;
  --set-e-soft:#18372E; --set-r-soft:#1C2A47; --set-x-soft:#3A2D14;
  --focus:#7AD2B7; --danger:#E58A78; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.btn.quiet:hover{color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- overview ---------- */
.masthead{padding-block:28px 8px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600;margin:0 0 8px}
h1.title{font:700 clamp(24px,5.2vw,34px)/1.3 var(--serif);margin:0 0 10px;text-wrap:balance;letter-spacing:.01em}
.lede{margin:0;color:var(--muted);max-width:62ch}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px}
.meter{flex:1 1 220px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:120px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.progress b{font-variant-numeric:tabular-nums}
.savenote{font-size:13px;color:var(--faint)}
.savenote.warn{color:var(--danger)}

.panel{margin-top:22px}
.panel>h2,.section-title{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 10px}
details.fold{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:20px;color:var(--faint);line-height:1}
details.fold[open]>summary::after{content:"−"}
.fold-body{padding:4px 0 14px}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.notes b{color:var(--accent);min-width:5.2em}
.scoreguide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.scoreguide div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:13.5px;line-height:1.5}
.scoreguide b{display:block;font-size:15px}

/* map of 32 items */
.map{display:flex;flex-wrap:wrap;gap:16px 22px}
.seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg-label i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.seg-tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{--c:var(--set-e);--cs:var(--set-e-soft);width:40px;height:48px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative;font-variant-numeric:tabular-nums}
.tile.set-REC{--c:var(--set-r);--cs:var(--set-r-soft)}
.tile.set-EXT{--c:var(--set-x);--cs:var(--set-x-soft)}
.tile::before{content:"";position:absolute;left:6px;right:6px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.tile b{font-size:14px}
.tile small{font-size:12px;color:var(--faint);margin-top:2px}
.tile.done{background:var(--cs);border-color:var(--c)}
.tile.done small{color:var(--ink);font-weight:700}
.tile:hover{border-color:var(--c)}
.tile.noted::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.mapnote{margin:12px 0 0;font-size:13px;color:var(--muted)}
.stats{margin:0 0 14px;color:var(--ink)}
.stats b{font-variant-numeric:tabular-nums}

/* tables */
.tbl{margin-top:30px}
.tbl>header{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.tbl>header h2{font:700 19px/1.4 var(--serif);margin:0}
.tbl>header p{margin:0;color:var(--muted);font-size:14px}
.grp{margin:22px 0 4px;font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px;color:var(--c)}
.grp::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.grp.set-E10{--c:var(--set-e)} .grp.set-REC{--c:var(--set-r)} .grp.set-EXT{--c:var(--set-x)}
.arow{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.arow-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.aid{font:700 15px var(--sans);color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.aname{font-weight:700}
.azh{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6}
.items{display:grid;gap:8px}
@media (min-width:760px){.arow{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:6px 28px}}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.item:hover{border-color:var(--accent)}
.item-id{font:700 13px var(--sans);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item-title{display:block;font-weight:700;line-height:1.45}
.item-req{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:2px}
.item-state{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:3.4em}
.badge{font-size:13px;font-weight:700;border-radius:99px;padding:1px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.sc{background:var(--accent);color:var(--on-accent)}
.badge.cj{background:var(--surface-2);color:var(--muted)}
.badge.none{color:var(--faint);font-weight:500;padding-right:0}
.tag-note{font-size:12px;color:var(--accent)}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.plain{margin-top:6px}
.plain summary{cursor:pointer;color:var(--muted);font-size:13.5px;min-height:40px;display:flex;align-items:center}
.plain-tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.plain-tags span{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--surface)}
.plain-tags b{color:var(--faint);margin-right:4px;font-weight:600}
.sec-sub{margin:20px 0 6px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline}
.sec-sub small{font-weight:500;color:var(--faint);font-size:13px}
.t2-list{display:grid;gap:8px;padding-top:6px}
.t2-zh{margin:10px 0 0;color:var(--muted);font-size:14px}

/* full ARRIVE panorama */
.pano{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px 10px;min-width:0}
.pcell h3{margin:0 0 7px;font-size:13px;font-weight:700;line-height:1.35;display:flex;gap:6px;align-items:baseline}
.pcell h3 b{color:var(--faint);font-variant-numeric:tabular-nums;min-width:1.2em}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{--c:var(--set-e);--cs:var(--set-e-soft);position:relative;min-width:44px;min-height:38px;padding:0 9px;border-radius:9px;border:1.5px dashed var(--line-strong);background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pchip.set-REC{--c:var(--set-r);--cs:var(--set-r-soft)} .pchip.set-EXT{--c:var(--set-x);--cs:var(--set-x-soft)}
.pchip.ext{border:1.5px solid var(--c);background:var(--cs);color:var(--c)}
.pchip small{font-size:11.5px;font-weight:700;background:var(--c);color:var(--surface);border-radius:99px;min-width:1.5em;padding:0 5px;line-height:1.5;text-align:center}
.pchip:hover{border-color:var(--c);color:var(--c)}
.pchip.add{border-style:solid;border-color:var(--accent);color:var(--accent);--c:var(--accent)}
.pchip.has-add::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.pchip.sample{min-width:34px;min-height:22px;padding:0;cursor:default;vertical-align:middle;margin-right:6px}
.pchip.sample.has-add::after{width:8px;height:8px;top:-3px;right:-3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 4px;font-size:13px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center}

/* table 1 toolbar, un-extended rows */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:12px 0 0}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.toggle button{min-height:40px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.toggle button+button{border-left:1px solid var(--line-strong)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.arow{scroll-margin-top:14px}
.arow.noext{padding:10px 0;border-bottom:1px dashed var(--line);align-content:start}
.arow.noext .aname{color:var(--muted)}
.arow.noext .aid{color:var(--faint)}
.noext-tag{font-size:12px;font-weight:600;color:var(--faint);border:1px dashed var(--line-strong);border-radius:99px;padding:0 9px;white-space:nowrap;line-height:1.7}
.aen{display:none;margin:5px 0 0;font:13px/1.6 var(--serif);color:var(--faint)}
.show-en .aen{display:block}
.aen .lab{font:700 11px var(--sans);letter-spacing:.08em;margin-right:6px}
.view-ext .arow.noext:not(.has-adds){display:none}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* expert-added suggestions */
.addzone{display:grid;gap:10px;min-width:0;align-content:start}
.addzone:empty{display:none}
.adds-act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.addcard{border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface);padding:12px 14px 14px;display:grid;gap:6px;scroll-margin-top:14px}
.addcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.addcard-h b{font-size:14px;color:var(--accent)}
.addcard label.t{font-weight:700;font-size:13.5px;margin-top:4px}
.addcard .opt-note{font-weight:500;color:var(--faint)}
.addcard textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.6;font-size:15px}
.addcard textarea.short{min-height:66px}
.addcard textarea:focus,.addcard select:focus{background:var(--surface)}
.addcard select{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;padding:0 10px;background:var(--bg);width:100%;min-width:0}
.addnote{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.65}
.t2-add{margin-top:24px;padding-top:14px;border-top:1px dashed var(--line-strong);display:grid;gap:10px}
.t2-add p{margin:0;font-size:14px;color:var(--muted)}
.chips button{font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--surface);cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
@media (min-width:760px){.arow.noext{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}

/* profile form */
.pf{display:grid;gap:16px;padding-top:8px}
.pf-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:grid;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=email]{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface);font-size:14px}
.opt input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.basis{display:grid;gap:8px}
.basis .brow{display:grid;grid-template-columns:minmax(7em,10em) 1fr;gap:10px;align-items:center}
@media (max-width:520px){.basis .brow{grid-template-columns:1fr}}
.pfstate{font-size:13px;font-weight:500;color:var(--faint)}
.pf-note{margin:0;font-size:13px;color:var(--muted)}
.pfstate.ok{color:var(--accent)}

/* export */
.export-box{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:12px}
.export-box h3{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid var(--line-strong);border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--surface)}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.resume input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.resume-msg{color:var(--accent);font-weight:600}
.resume-msg.warn{color:var(--warn,#955A0C)}
.mailline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px}
.mailline b{user-select:all;word-break:break-all}
.btn.big{min-height:52px;padding:0 34px;font-size:17px}
.subfold{margin-top:4px}
.subfold .q{margin:0 0 10px}
details.resume-fold{margin-top:10px;font-size:13.5px;color:var(--muted)}
details.resume-fold>summary{cursor:pointer;padding:4px 0}
details.resume-fold .resume{margin-top:6px}
.wxwarn{margin:0 0 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--warn,#955A0C);color:var(--warn,#955A0C);font-size:14px;line-height:1.55}
.status{min-height:1.5em;font-size:14px;color:var(--accent)}
.status.err{color:var(--danger)}
.fallback{width:100%;min-height:140px;border:1px solid var(--line-strong);border-radius:10px;padding:10px;background:var(--surface);font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.foot{margin:34px 0 0;padding-block:18px 36px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}

/* ---------- item page ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.bar .where{flex:1;min-width:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where small{color:var(--faint);font-weight:500;margin-left:6px}
.bar .prog{height:3px;background:var(--surface-2)}
.bar .prog i{display:block;height:100%;background:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"c1" "side" "c2";gap:22px;padding-block:20px 120px}
.c1{grid-area:c1;min-width:0}.c2{grid-area:c2;min-width:0;margin-top:-22px}.side{grid-area:side}
@media (min-width:960px){.detail{grid-template-columns:minmax(0,1fr) 370px;grid-template-areas:"c1 side" "c2 side";grid-template-rows:auto 1fr;column-gap:40px;row-gap:0;padding-bottom:60px;align-items:start}.c2{margin-top:0}}
.crumb{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--muted)}
.crumb .dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:8px;vertical-align:baseline}
.crumb.set-E10{--c:var(--set-e)} .crumb.set-REC{--c:var(--set-r)} .crumb.set-EXT{--c:var(--set-x)}
h1.item-h{font:700 clamp(22px,4.6vw,28px)/1.35 var(--serif);margin:0 0 18px;text-wrap:balance}
h1.item-h:focus{outline:none}
h1.item-h .id{display:block;font:700 14px var(--sans);letter-spacing:.06em;color:var(--accent);margin-bottom:4px;font-variant-numeric:tabular-nums}
.blk{margin-top:22px}
.blk>h2{font-size:12.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h2 .sub{font-weight:500;letter-spacing:0;color:var(--faint)}
.arrive-tag{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.arrive-tag b{font-size:15px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--cs);color:var(--c)}
.pill.set-E10{--c:var(--set-e);--cs:var(--set-e-soft)} .pill.set-REC{--c:var(--set-r);--cs:var(--set-r-soft)} .pill.set-EXT{--c:var(--set-x);--cs:var(--set-x-soft)}
.quote{margin:0;padding:0;display:grid;gap:8px}
.quote .en{font:15.5px/1.65 var(--serif);color:var(--ink)}
.quote .zh{font-size:14.5px;color:var(--muted);line-height:1.7}
.quote .lab{font-size:11.5px;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:6px}
.noarrive{margin:0;color:var(--muted);font-size:14.5px}
.req{background:var(--accent-soft);border-radius:14px;padding:18px 18px 16px;margin-top:22px}
.req>h2{font-size:12.5px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin:0 0 8px}
.req p{margin:0 0 8px;font-size:17px;line-height:1.85;font-weight:500}
.req p:last-child{margin-bottom:0}
.why{margin:10px 2px 0;font-size:12.5px;line-height:1.7;color:var(--faint)}
.why b{font-weight:600;color:var(--faint);margin-right:6px}
.prev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.prev .pnote{margin:0 0 8px;font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.prow:first-of-type{border-top:0}
.prow .pl{font-size:14px;min-width:0}
.prow .pv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .pv small{font-weight:500;color:var(--muted);margin-left:4px}
.prow .bar2{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prow .bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prow .pl small{display:inline-block;margin-left:8px;font-size:12px;color:var(--faint)}
.pfoot{margin:8px 0 0;font-size:12px;color:var(--faint);line-height:1.6}
.example{margin:0;border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;background:var(--surface);font-size:15px;line-height:1.85}
.exnote{margin:6px 2px 0;font-size:12px;color:var(--faint)}

.side{border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);padding:18px 16px;display:grid;gap:16px}
@media (min-width:960px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}}
.side h2{margin:0;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side h2 small{font-size:12px;font-weight:600;color:var(--danger)}
.q{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.scale{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-top:8px}
.scale button{min-height:50px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);cursor:pointer;font-weight:700;font-size:17px;padding:0;font-variant-numeric:tabular-nums}
.scale button:hover{border-color:var(--accent);color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.bands span{font-size:11.5px;line-height:1.35;text-align:center;color:var(--muted);border-top:2px solid var(--line-strong);padding-top:4px}
.cjbtn{margin-top:10px;width:100%}
.cjbtn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink);color:var(--ink)}
.side textarea{width:100%;min-height:128px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.6;font-size:15px}
.side textarea:focus{background:var(--surface)}
.side label.t{font-weight:700;font-size:14px;display:block;margin-bottom:2px}
.side .hint{font-size:12.5px;color:var(--faint);margin:0 0 6px;line-height:1.55}
.saved{font-size:12.5px;color:var(--faint);min-height:1.4em}
.saved.ok::before{content:"✓ ";color:var(--accent)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navrow .next{grid-column:1/-1}
@media (max-width:959px){.side .navrow{display:none}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.dock .mid{text-align:center;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .mid b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (min-width:960px){.dock{display:none}}
@media (max-width:420px){.btn{padding:0 12px}.tile{width:36px}.scoreguide{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="app-data" type="application/json">{"version":"v20261030","scale":{"min":1,"max":9},"arriveRows":[{"id":"1a","name":"研究设计","set":"E10","itemIds":[],"zh":"对每项实验简述研究设计，包括比较的组别及对照组；未设置对照组时说明理由。","ext":false,"main":"1","nameEn":"Study design","en":"For each experiment, provide brief details of study design including: (a) The groups being compared, including control groups. If no control group has been used, the rationale should be stated."},{"id":"1b","name":"研究设计","set":"E10","itemIds":[],"zh":"对每项实验说明实验单位，例如单只动物、一窝动物或一笼动物。","ext":false,"main":"1","nameEn":"Study design","en":"For each experiment, provide brief details of study design including: (b) The experimental unit (e.g. a single animal, litter, or cage of animals)."},{"id":"2a","name":"样本量","set":"E10","itemIds":[],"zh":"明确各组分配的实验单位数、每项实验的实验单位总数，以及所用动物总数。","ext":false,"main":"2","nameEn":"Sample size","en":"Specify the exact number of experimental units allocated to each group, and the total number in each experiment. Also indicate the total number of animals used."},{"id":"2b","name":"样本量","set":"E10","itemIds":[],"zh":"解释样本量如何确定；如开展了事前样本量计算，提供计算细节。","ext":false,"main":"2","nameEn":"Sample size","en":"Explain how the sample size was decided. Provide details of any a priori sample size calculation, if done."},{"id":"3a","name":"纳入和排除标准","set":"E10","itemIds":["CHM-01"],"zh":"描述实验期间动物或实验单位、分析期间数据点的纳入和排除标准，说明是否预先设定；未设定时明确说明。","ext":true,"main":"3","nameEn":"Inclusion and exclusion criteria","en":"Describe any criteria used for including and excluding animals (or experimental units) during the experiment, and data points during the analysis. Specify if these criteria were established a priori. If no criteria were set, state this explicitly."},{"id":"3b","name":"纳入和排除标准","set":"E10","itemIds":[],"zh":"逐组报告未纳入分析的动物、实验单位或数据点及其原因；无排除时明确说明。","ext":false,"main":"3","nameEn":"Inclusion and exclusion criteria","en":"For each experimental group, report any animals, experimental units or data points not included in the analysis and explain why. If there were no exclusions, state so."},{"id":"3c","name":"纳入和排除标准","set":"E10","itemIds":[],"zh":"对每项分析报告各组准确的样本量n。","ext":false,"main":"3","nameEn":"Inclusion and exclusion criteria","en":"For each analysis, report the exact value of n in each experimental group."},{"id":"4a","name":"随机化","set":"E10","itemIds":[],"zh":"说明是否随机分配实验单位至对照组和干预组；如采用，提供随机序列的生成方法。","ext":false,"main":"4","nameEn":"Randomisation","en":"State whether randomisation was used to allocate experimental units to control and treatment groups. If done, provide the method used to generate the randomisation sequence."},{"id":"4b","name":"随机化","set":"E10","itemIds":["CHM-02"],"zh":"描述减少潜在混杂因素的策略，例如处理和测量顺序、动物或笼位；未控制混杂因素时明确说明。","ext":true,"main":"4","nameEn":"Randomisation","en":"Describe the strategy used to minimise potential confounders such as the order of treatments and measurements, or animal/cage location. If confounders were not controlled, state this explicitly."},{"id":"5","name":"盲法","set":"E10","itemIds":[],"zh":"描述在分组、实验实施、结局评估及数据分析各阶段，哪些人员知晓组别分配。","ext":false,"main":"5","nameEn":"Blinding","en":"Describe who was aware of the group allocation at the different stages of the experiment (during the allocation, the conduct of the experiment, the outcome assessment, and the data analysis)."},{"id":"6a","name":"结局指标","set":"E10","itemIds":["CHM-03"],"zh":"清楚定义所有评估的结局指标，例如细胞死亡、分子标志物或行为变化。","ext":true,"main":"6","nameEn":"Outcome measures","en":"Clearly define all outcome measures assessed (e.g. cell death, molecular markers, or behavioural changes)."},{"id":"6b","name":"结局指标","set":"E10","itemIds":[],"zh":"对假设检验研究，明确主要结局指标，即用于确定样本量的结局指标。","ext":false,"main":"6","nameEn":"Outcome measures","en":"For hypothesis-testing studies, specify the primary outcome measure, i.e. the outcome measure that was used to determine the sample size."},{"id":"7a","name":"统计方法","set":"E10","itemIds":[],"zh":"提供每项分析的统计方法细节，包括所用软件。","ext":false,"main":"7","nameEn":"Statistical methods","en":"Provide details of the statistical methods used for each analysis, including software used."},{"id":"7b","name":"统计方法","set":"E10","itemIds":[],"zh":"描述评估数据是否满足统计方法假设的方法，以及假设不满足时的处理。","ext":false,"main":"7","nameEn":"Statistical methods","en":"Describe any methods used to assess whether the data met the assumptions of the statistical approach, and what was done if the assumptions were not met."},{"id":"8a","name":"实验动物","set":"E10","itemIds":[],"zh":"提供适合该物种的动物信息，包括物种、品系及亚系、性别、年龄或发育阶段，以及相关时的体质量（体重）。","ext":false,"main":"8","nameEn":"Experimental animals","en":"Provide species-appropriate details of the animals used, including species, strain and substrain, sex, age or developmental stage, and, if relevant, weight."},{"id":"8b","name":"实验动物","set":"E10","itemIds":[],"zh":"提供动物来源、健康或免疫状态、遗传修饰状态、基因型和既往操作等其他相关信息。","ext":false,"main":"8","nameEn":"Experimental animals","en":"Provide further relevant information on the provenance of animals, health/immune status, genetic modification status, genotype, and any previous procedures."},{"id":"9a","name":"实验程序","set":"E10","itemIds":[],"zh":"对每个实验组（包括对照组），详细描述做了什么、如何实施以及使用了什么，使他人能够重复实验。","ext":true,"main":"9","nameEn":"Experimental procedures","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (a) What was done, how it was done and what was used."},{"id":"9b","name":"实验程序","set":"E10","itemIds":[],"zh":"对每个实验组（包括对照组），详细报告程序实施的时间和频次，使他人能够重复实验。","ext":false,"main":"9","nameEn":"Experimental procedures","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (b) When and how often."},{"id":"9c","name":"实验程序","set":"E10","itemIds":[],"zh":"对每个实验组（包括对照组），详细报告程序实施地点，包括适应期细节，使他人能够重复实验。","ext":false,"main":"9","nameEn":"Experimental procedures","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (c) Where (including detail of any acclimatisation periods)."},{"id":"9d","name":"实验程序","set":"E10","itemIds":["CHM-22","CHM-23","CHM-24"],"zh":"对每个实验组（包括对照组），说明采用相关程序的理由和依据。","ext":true,"main":"9","nameEn":"Experimental procedures","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (d) Why (provide rationale for procedures)."},{"id":"10a","name":"结果","set":"E10","itemIds":[],"zh":"对开展的每项实验（包括独立重复实验），报告各组的汇总或描述性统计量，并在适用时提供变异性指标，例如均值与标准差或中位数与范围。","ext":false,"main":"10","nameEn":"Results","en":"For each experiment conducted, including independent replications, report: (a) Summary/descriptive statistics for each experimental group, with a measure of variability where applicable (e.g. mean and SD, or median and range)."},{"id":"10b","name":"结果","set":"E10","itemIds":[],"zh":"对开展的每项实验（包括独立重复实验），在适用时报告效应量及其置信区间。","ext":false,"main":"10","nameEn":"Results","en":"For each experiment conducted, including independent replications, report: (b) If applicable, the effect size with a confidence interval."},{"id":"11","name":"摘要","set":"REC","itemIds":[],"zh":"准确概述研究目的、动物物种、品系和性别、关键方法、主要发现及研究结论。","ext":false,"main":"11","nameEn":"Abstract","en":"Provide an accurate summary of the research objectives, animal species, strain and sex, key methods, principal findings, and study conclusions."},{"id":"12a","name":"背景","set":"REC","itemIds":["CHM-25"],"zh":"提供充分的科学背景，说明研究的依据和背景，并解释实验研究方法。","ext":true,"main":"12","nameEn":"Background","en":"Include sufficient scientific background to understand the rationale and context for the study, and explain the experimental approach."},{"id":"12b","name":"背景","set":"REC","itemIds":[],"zh":"解释所用动物物种和模型如何回应科学目标，并在适当情况下说明其与人类生物学的关联。","ext":false,"main":"12","nameEn":"Background","en":"Explain how the animal species and model used address the scientific objectives and, where appropriate, the relevance to human biology."},{"id":"13","name":"研究目的","set":"REC","itemIds":[],"zh":"清楚描述研究问题、研究目的，以及适用时所检验的具体假设。","ext":false,"main":"13","nameEn":"Objectives","en":"Clearly describe the research question, research objectives and, where appropriate, specific hypotheses being tested."},{"id":"14","name":"伦理声明","set":"REC","itemIds":[],"zh":"提供批准动物使用的伦理审查委员会或同等机构名称，以及相关许可或方案编号（如适用）。未申请或未获伦理批准时说明理由。","ext":false,"main":"14","nameEn":"Ethical statement","en":"Provide the name of the ethical review committee or equivalent that has approved the use of animals in this study, and any relevant licence or protocol numbers (if applicable). If ethical approval was not sought or granted, provide a justification."},{"id":"15","name":"饲养与管理","set":"REC","itemIds":["CHM-26"],"zh":"提供饲养和管理条件的细节，包括环境丰富化措施。","ext":true,"main":"15","nameEn":"Housing and husbandry","en":"Provide details of housing and husbandry conditions, including any environmental enrichment."},{"id":"16a","name":"动物照护与监测","set":"REC","itemIds":[],"zh":"描述实验方案中为减少疼痛、痛苦和应激所采取的干预或措施。","ext":false,"main":"16","nameEn":"Animal care and monitoring","en":"Describe any interventions or steps taken in the experimental protocols to reduce pain, suffering and distress."},{"id":"16b","name":"动物照护与监测","set":"REC","itemIds":[],"zh":"报告预期或非预期的不良事件。","ext":false,"main":"16","nameEn":"Animal care and monitoring","en":"Report any expected or unexpected adverse events."},{"id":"16c","name":"动物照护与监测","set":"REC","itemIds":["CHM-27"],"zh":"描述研究设定的人道终点、监测的体征及监测频率；未设定人道终点时明确说明。","ext":true,"main":"16","nameEn":"Animal care and monitoring","en":"Describe the humane endpoints established for the study, the signs that were monitored and the frequency of monitoring. If the study did not have humane endpoints, state this."},{"id":"17a","name":"结果解释与科学意义","set":"REC","itemIds":["CHM-28","CHM-29"],"zh":"结合研究目的和假设、现有理论及相关文献研究解释结果。","ext":true,"main":"17","nameEn":"Interpretation/scientific implications","en":"Interpret the results, taking into account the study objectives and hypotheses, current theory and other relevant studies in the literature."},{"id":"17b","name":"结果解释与科学意义","set":"REC","itemIds":["CHM-30"],"zh":"讨论研究局限，包括潜在偏倚来源、动物模型局限及结果的不精确性。","ext":true,"main":"17","nameEn":"Interpretation/scientific implications","en":"Comment on the study limitations including potential sources of bias, limitations of the animal model, and imprecision associated with the results."},{"id":"18","name":"可推广性与转化","set":"REC","itemIds":[],"zh":"讨论研究结果是否以及如何推广至其他物种或实验条件，并在适当情况下说明与人类生物学的关联。","ext":false,"main":"18","nameEn":"Generalisability/translation","en":"Comment on whether, and how, the findings of this study are likely to generalise to other species or experimental conditions, including any relevance to human biology (where appropriate)."},{"id":"19","name":"方案注册","set":"REC","itemIds":[],"zh":"声明是否在研究开始前制定方案，包括研究问题、关键设计特征和分析计划，以及是否注册和注册位置。","ext":false,"main":"19","nameEn":"Protocol registration","en":"Provide a statement indicating whether a protocol (including the research question, key design features, and analysis plan) was prepared before the study, and if and where this protocol was registered."},{"id":"20","name":"数据获取","set":"REC","itemIds":[],"zh":"声明研究数据是否可获取及获取位置。","ext":false,"main":"20","nameEn":"Data access","en":"Provide a statement describing if and where study data are available."},{"id":"21a","name":"利益声明","set":"REC","itemIds":[],"zh":"声明潜在的财务及非财务利益冲突；无利益冲突时明确说明。","ext":false,"main":"21","nameEn":"Declaration of interests","en":"Declare any potential conflicts of interest, including financial and non-financial. If none exist, this should be stated."},{"id":"21b","name":"利益声明","set":"REC","itemIds":[],"zh":"列出全部资助来源，包括项目标识，并说明资助方在设计、分析和报告中的作用。","ext":false,"main":"21","nameEn":"Declaration of interests","en":"List all funding sources (including grant identifier) and the role of the funder(s) in the design, analysis and reporting of the study."},{"id":"title","name":"标题候选","set":"EXT","itemIds":["CHM-31","CHM-32"],"zh":"ARRIVE 2.0 无独立标题条目；条目11 为摘要，以下候选不直接归属于11。","ext":true}],"arriveMap":{"3a":{"id":"3a","set":"E10","nameZh":"纳入和排除标准","nameEn":"Inclusion and exclusion criteria","zh":"描述实验期间动物或实验单位、分析期间数据点的纳入和排除标准，说明是否预先设定；未设定时明确说明。","en":"Describe any criteria used for including and excluding animals (or experimental units) during the experiment, and data points during the analysis. Specify if these criteria were established a priori. If no criteria were set, state this explicitly."},"4b":{"id":"4b","set":"E10","nameZh":"随机化","nameEn":"Randomisation","zh":"描述减少潜在混杂因素的策略，例如处理和测量顺序、动物或笼位；未控制混杂因素时明确说明。","en":"Describe the strategy used to minimise potential confounders such as the order of treatments and measurements, or animal/cage location. If confounders were not controlled, state this explicitly."},"6a":{"id":"6a","set":"E10","nameZh":"结局指标","nameEn":"Outcome measures","zh":"清楚定义所有评估的结局指标，例如细胞死亡、分子标志物或行为变化。","en":"Clearly define all outcome measures assessed (e.g. cell death, molecular markers, or behavioural changes)."},"9a":{"id":"9a","set":"E10","nameZh":"实验程序","nameEn":"Experimental procedures","zh":"对每个实验组（包括对照组），详细描述做了什么、如何实施以及使用了什么，使他人能够重复实验。","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (a) What was done, how it was done and what was used."},"9d":{"id":"9d","set":"E10","nameZh":"实验程序","nameEn":"Experimental procedures","zh":"对每个实验组（包括对照组），说明采用相关程序的理由和依据。","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (d) Why (provide rationale for procedures)."},"12a":{"id":"12a","set":"REC","nameZh":"背景","nameEn":"Background","zh":"提供充分的科学背景，说明研究的依据和背景，并解释实验研究方法。","en":"Include sufficient scientific background to understand the rationale and context for the study, and explain the experimental approach."},"15":{"id":"15","set":"REC","nameZh":"饲养与管理","nameEn":"Housing and husbandry","zh":"提供饲养和管理条件的细节，包括环境丰富化措施。","en":"Provide details of housing and husbandry conditions, including any environmental enrichment."},"16c":{"id":"16c","set":"REC","nameZh":"动物照护与监测","nameEn":"Animal care and monitoring","zh":"描述研究设定的人道终点、监测的体征及监测频率；未设定人道终点时明确说明。","en":"Describe the humane endpoints established for the study, the signs that were monitored and the frequency of monitoring. If the study did not have humane endpoints, state this."},"17a":{"id":"17a","set":"REC","nameZh":"结果解释与科学意义","nameEn":"Interpretation/scientific implications","zh":"结合研究目的和假设、现有理论及相关文献研究解释结果。","en":"Interpret the results, taking into account the study objectives and hypotheses, current theory and other relevant studies in the literature."},"17b":{"id":"17b","set":"REC","nameZh":"结果解释与科学意义","nameEn":"Interpretation/scientific implications","zh":"讨论研究局限，包括潜在偏倚来源、动物模型局限及结果的不精确性。","en":"Comment on the study limitations including potential sources of bias, limitations of the animal model, and imprecision associated with the results."}},"table2Sections":["一、中药干预——物料与制备链","二、动物模型","三、干预实施"],"items":[{"id":"CHM-01","title":"模型动物的纳入与排除标准","req":"若研究使用疾病、证候或病证结合动物模型，应报告模型动物进入分析前的纳入与排除标准，包括造模成功的判定阈值（如证候评分、生化/病理指标门槛）、未达阈值动物的处理方式。","table":1,"set":"E10","arrive":"3a","n":1,"why":"造模成功的判定阈值决定哪些动物进入分析，属样本筛选，故归入 3a；模型验证所用的指标或方法另见 CHM-19。","example":"造模第14天进行脾虚证评分（摄食量、体重变化、大便性状、活动度、毛色，每项0–3分，满分15分）；总分≥8分且体重较空白组降低≥10%者判定造模成功，纳入后续给药实验。未达标准的动物（n＝4）予以剔除，不进入分组及分析。","arriveRef":"3a","prev":null},{"id":"CHM-02","title":"受试物批次的混杂控制","req":"若研究所用的中药原料、自制中间产物或给药制剂涉及多个批次（如实验分批进行、长疗程中途换批），应说明为避免批次混杂所采取的措施，如全程使用同一批号、各组动物在各批次间均衡分配等；未采取控制措施时明确说明。","table":1,"set":"E10","arrive":"4b","n":2,"why":"中药原料受产地、采收期、炮制与提取工艺影响，批间成分差异大，且多为研究者自制。与 CHM-06 的分工：CHM-06 问用的是哪一批（可追溯），本条问有多批时批次与组别如何对应（设计控制）。","example":"全部实验使用同一批号（20250312）的黄芪饮片，由同一人一次性煎煮、浓缩并冻干，分装后−20℃保存，各组均使用该批冻干粉。实验分两个批次进行，每批均含全部各组动物，且各组动物数相等。","arriveRef":"4b","prev":null},{"id":"CHM-03","title":"中医证候相关结局的评估方法","req":"若研究将体征、行为表现或中医证候量表评分作为评价干预后中医证候改善的结局指标，如舌象（如适用）、摄食、大便性状、毛色、活动度等，应说明具体评估方法，如评分标准、量表来源、判定依据等。","table":1,"set":"E10","arrive":"6a","n":3,"why":"仅限于把相关指标用作评价证候改善的情形；要求落在判定方法上，所列指标只是开放式举例，不作穷举。","example":"以摄食量、大便性状、毛色和活动度评价脾气虚证的改善。评分标准参照文献[12]制定：每项0–3分，总分越高提示证候越重；由两名不知分组的研究人员独立评分，取均值。","arriveRef":"6a","prev":{"components":[{"code":"CHI-34","label":"证候结局评估方法","N":399,"yes":5,"no":1,"na":393,"unclear":0,"applicable":6,"rate":83.3}],"note":null,"merged":false}},{"id":"CHM-04","title":"名称、基原与组成","req":"应报告中药干预的具体名称（不得仅用“中药”“复方”等泛称）。具有明确剂型时，报告所用剂型。干预为单味药或复方（含其提取物）时，逐味报告：植物、真菌或动物来源的药味，报告基原拉丁学名（含命名人）、药用部位和产地（药材的生长或采集地）；矿物药及无基原的药味，报告所依据标准（如《中国药典》）中的规范名称。复方另报各药味的处方量。直接购买的成品（如中成药）可引用其公开资料代替逐味报告；因保密、专利等原因无法公开或无法获得组成或处方量的，声明并说明原因。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":4,"why":"中药有大量同名异物与同物异名，有基原的药味需以基原拉丁学名（到种、含命名人）加药用部位确定，如桑叶、桑枝、桑白皮同出一物种而为不同药材。复方不公开组成会使实验无法复现，故保留声明并说明原因的出口。","example":"本研究干预为四君子汤（汤剂），由4味药组成：人参（Panax ginseng C.A.Mey.，根及根茎，产地吉林抚松）9 g、白术（Atractylodes macrocephala Koidz.，根茎，产地浙江磐安）9 g、茯苓（Poria cocos (Schw.) Wolf，菌核，产地安徽金寨）9 g、甘草（Glycyrrhiza uralensis Fisch.，根及根茎，产地内蒙古杭锦旗）6 g，每剂生药总重33 g。","arriveRef":"9a","prev":{"components":[{"code":"CHI-03","label":"剂型","N":399,"yes":193,"no":14,"na":192,"unclear":0,"applicable":207,"rate":93.2},{"code":"CHI-09","label":"全文中药名称","N":399,"yes":399,"no":0,"na":0,"unclear":0,"applicable":399,"rate":100.0},{"code":"CHI-10","label":"干预名称语言呈现","N":399,"yes":142,"no":207,"na":50,"unclear":0,"applicable":349,"rate":40.7},{"code":"CHI-11","label":"药味名称及剂量","N":399,"yes":131,"no":63,"na":199,"unclear":6,"applicable":194,"rate":67.5},{"code":"CHI-12","label":"药味语言呈现","N":399,"yes":120,"no":74,"na":202,"unclear":3,"applicable":194,"rate":61.9},{"code":"CHI-13","label":"药用部位","N":399,"yes":198,"no":76,"na":124,"unclear":1,"applicable":274,"rate":72.3},{"code":"CHI-14","label":"产地","N":399,"yes":60,"no":214,"na":124,"unclear":1,"applicable":274,"rate":21.9},{"code":"CHI-25","label":"天然药材拉丁名","N":399,"yes":105,"no":158,"na":135,"unclear":1,"applicable":263,"rate":39.9}],"note":null,"merged":true}},{"id":"CHM-05","title":"原料形态或加工类型","req":"当干预并非现成中成药时，应报告所用物料的类型（如鲜/干药材、饮片等）及制备形式（如水煎液、总提取物、分离组分、单体化合物等）。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":5,"why":"同一味药做成鲜品、饮片、水煎液、总提取物或单体，成分与药效可能完全不同。“剂型”指成品的药剂学形式，本条指进入实验的物料处于制备链的哪一步。","example":"所用物料为购入的干燥饮片；制备形式为饮片水煎液经浓缩、冷冻干燥所得的总提取物冻干粉，临用前以蒸馏水复溶。","arriveRef":"9a","prev":{"components":[{"code":"CHI-21","label":"产品原料形态","N":399,"yes":332,"no":22,"na":45,"unclear":0,"applicable":354,"rate":93.8}],"note":null,"merged":false}},{"id":"CHM-06","title":"来源与批号","req":"应报告中药原料或产品的供应来源，经正规渠道获得时，报告生产企业、供应商或医院药房，以及产品批号；自行采集时，报告采集来源。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":6,"why":"中药质量随产地、采收年份和批次波动，批号是把研究用药对应到具体一批原料的标识。","example":"饮片购自××药业有限公司，批号：人参2305016、白术2306112、茯苓2304087、甘草2305203。","arriveRef":"9a","prev":{"components":[{"code":"CHI-17","label":"供应来源","N":399,"yes":352,"no":47,"na":0,"unclear":0,"applicable":399,"rate":88.2},{"code":"CHI-18","label":"产品批号","N":399,"yes":134,"no":243,"na":21,"unclear":1,"applicable":377,"rate":35.5}],"note":null,"merged":true}},{"id":"CHM-07","title":"商品化成品信息","req":"使用商品化成品时，应报告其规格（单位包装的量或含量及单位）及生产日期和／或有效期。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":7,"why":"规格决定由成品折算到实际给药量能否核对，生产日期和有效期反映给药时药物所处的状态。","example":"阳性药××颗粒为商品化成品（××药业有限公司），规格：每袋10 g，相当于饮片30 g；生产日期2025年3月12日，有效期至2027年3月11日。","arriveRef":"9a","prev":{"components":[{"code":"CHI-19","label":"产品规格","N":399,"yes":17,"no":279,"na":102,"unclear":1,"applicable":296,"rate":5.7},{"code":"CHI-20","label":"生产日期／有效期","N":399,"yes":1,"no":298,"na":99,"unclear":1,"applicable":299,"rate":0.3}],"note":null,"merged":true}},{"id":"CHM-08","title":"鉴定与留样","req":"使用中药材或饮片原料（含研究者自行炮制所得饮片）时，应报告鉴定人、鉴定机构、鉴定方法或所依据标准的鉴别项中的至少一项，以及凭证标本或留样的保存情况（保存机构及编号）；研究者自行制得可保存形态的最终产品时，报告产品留样情况。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":8,"why":"伪品与混用品在药材流通中常见，身份未经确认则干预对象不确定；只报“已留存”而无保存机构与编号，仍无法追溯。炮制品按饮片处理，不要求重新作基原鉴定。","example":"药材经××大学药学院×××教授鉴定为真品，鉴定依据为性状及显微鉴别，所用标准为《中国药典》（2020年版）该药味项下的鉴别项。凭证标本保存于××大学标本馆，登记号：LZU-TCM-2025-0138。","arriveRef":"9a","prev":{"components":[{"code":"CHI-23","label":"原料鉴定方法","N":399,"yes":97,"no":156,"na":146,"unclear":0,"applicable":253,"rate":38.3},{"code":"CHI-24","label":"凭证标本／留样","N":399,"yes":34,"no":231,"na":134,"unclear":0,"applicable":265,"rate":12.8}],"note":null,"merged":true}},{"id":"CHM-09","title":"炮制","req":"若炮制步骤由研究者自行完成，应报告炮制方法（如炒、炙、煅、蒸、制炭等）、所依据的炮制标准（如《中国药典》炮制通则、地方炮制规范等）；涉及辅料时，报告辅料种类及用量比例；说明炮制程度（如炒黄、炒焦、炒炭等）或具体加热温度与时长。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":9,"why":"炮制改变成分与药性（如生地与熟地、生半夏与姜半夏功效不同），方法、依据、辅料、程度缺一则无法复现。以“由研究者自行完成”限定，购入的炮制品由 CHM-06、CHM-08 覆盖。","example":"熟地黄由研究者自行炮制：取生地黄，加黄酒（每100 kg生地黄用黄酒30 kg）拌匀，密闭，隔水炖至酒液被吸尽、药材内外乌黑发亮（约24 h），取出，晒至外皮黏液稍干，切厚片，干燥。炮制方法依据《中国药典》（2020年版）熟地黄项下的酒炖法。","arriveRef":"9a","prev":{"components":[{"code":"CHI-46","label":"炮制方法名称","N":399,"yes":11,"no":0,"na":387,"unclear":1,"applicable":11,"rate":100.0},{"code":"CHI-47","label":"辅料及用量比例","N":399,"yes":3,"no":3,"na":392,"unclear":1,"applicable":6,"rate":50.0},{"code":"CHI-48","label":"炮制程度／火候","N":399,"yes":5,"no":6,"na":387,"unclear":1,"applicable":11,"rate":45.5},{"code":"CHI-49","label":"炮制依据／标准","N":399,"yes":4,"no":7,"na":387,"unclear":1,"applicable":11,"rate":36.4}],"note":null,"merged":true}},{"id":"CHM-10","title":"提取","req":"若提取步骤由研究者自行完成，应报告提取溶剂的种类及浓度、料液比（注明单位）、提取方式（如回流、超声、煎煮等）及温度、提取次数及每次时长。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":10,"why":"溶剂、料液比、次数、时长与温度共同决定提取物的成分谱，只报其中一两项不足以复现同一提取物。","example":"取四君子汤饮片1 kg，加10倍量蒸馏水（料液比1:10，kg/L）浸泡30 min，100℃煎煮提取2次，每次1 h，合并两次滤液。","arriveRef":"9a","prev":{"components":[{"code":"CHI-38","label":"提取溶剂种类及浓度","N":399,"yes":185,"no":32,"na":181,"unclear":1,"applicable":217,"rate":85.3},{"code":"CHI-39","label":"药材-溶剂比例","N":399,"yes":135,"no":82,"na":181,"unclear":1,"applicable":217,"rate":62.2},{"code":"CHI-40","label":"提取次数","N":399,"yes":148,"no":68,"na":181,"unclear":2,"applicable":216,"rate":68.5},{"code":"CHI-41","label":"单次提取时长","N":399,"yes":148,"no":69,"na":181,"unclear":1,"applicable":217,"rate":68.2},{"code":"CHI-42","label":"提取温度／方式","N":399,"yes":181,"no":36,"na":181,"unclear":1,"applicable":217,"rate":83.4}],"note":null,"merged":true}},{"id":"CHM-11","title":"浓缩与干燥","req":"若浓缩或干燥步骤由研究者自行完成，应报告具体方式（如减压浓缩、常压浓缩、喷雾干燥、冷冻干燥等）及终点指标（如生药当量、干膏得率、终体积等）。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":11,"why":"浓缩与干燥方式影响热不稳定成分的存留；终点指标（生药当量、得率等）是把提取物的量换算回原药材量的依据。","example":"合并滤液经旋转蒸发仪减压浓缩（50℃，−0.09 MPa）至每毫升相当于生药2 g，再冷冻干燥48 h得冻干粉，干膏得率12.4%（干膏重/生药重）。","arriveRef":"9a","prev":{"components":[{"code":"CHI-43","label":"浓缩方式","N":399,"yes":133,"no":69,"na":193,"unclear":4,"applicable":202,"rate":65.8},{"code":"CHI-44","label":"浓缩终点","N":399,"yes":124,"no":79,"na":193,"unclear":3,"applicable":203,"rate":61.1}],"note":null,"merged":true}},{"id":"CHM-12","title":"最终给药制剂配制","req":"若最终给药制剂由研究者自行配制，溶液、混悬液等液体制剂应报告溶媒种类和终给药浓度；颗粒剂、片剂等固体制剂报告具体制备工艺。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":12,"why":null,"example":"给药前将冻干粉用蒸馏水溶解，配制成含生药0.35 g/mL的药液，现用现配，灌胃体积10 mL/kg。","arriveRef":"9a","prev":{"components":[{"code":"CHI-45","label":"复溶／混悬配制方式","N":399,"yes":196,"no":184,"na":19,"unclear":0,"applicable":380,"rate":51.6}],"note":null,"merged":false}},{"id":"CHM-13","title":"指标或活性成分含量","req":"使用标准化产品时，应报告指标性或活性成分的含量及单位；使用单体化合物时，报告其纯度。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":13,"why":null,"example":"HPLC法测得所用黄芪提取物中黄芪甲苷含量为0.62 mg/g；所用单体化合物黄芩苷（××公司）纯度≥98%（HPLC法，面积归一化法）。","arriveRef":"9a","prev":{"components":[{"code":"CHI-27","label":"指标成分含量","N":399,"yes":124,"no":101,"na":169,"unclear":5,"applicable":225,"rate":55.1}],"note":null,"merged":false}},{"id":"CHM-14","title":"化学表征方法与对照品来源","req":"开展化学表征或定量分析时，应报告所用分析方法及仪器；使用化学对照品、对照药材或对照提取物等时，报告其来源。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":14,"why":"含量与图谱是否可信取决于方法、仪器和对照品来源，只给结果不给这些信息，数据无法评价也无法重复。","example":"采用HPLC-DAD法测定（Agilent 1260；C18柱，250 mm×4.6 mm，5 μm；流动相：乙腈—0.1%磷酸水溶液梯度洗脱；检测波长254 nm）。对照品黄芩苷购自中国食品药品检定研究院（批号：××）。","arriveRef":"9a","prev":{"components":[{"code":"CHI-28","label":"化学表征方法","N":399,"yes":210,"no":6,"na":182,"unclear":1,"applicable":216,"rate":97.2},{"code":"CHI-29","label":"化学对照品来源","N":399,"yes":68,"no":144,"na":182,"unclear":5,"applicable":212,"rate":32.1}],"note":null,"merged":true}},{"id":"CHM-15","title":"质量控制检测项目","req":"如报告质量控制检测，应说明除成分含量或单体纯度外的具体检测项目，如重金属及有害元素、农药残留、微生物限度、残留溶剂、有关物质等，并注明所采用的检验方法。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":15,"why":"本条问查了哪些项、用什么方法查（限于成分含量和纯度之外的项目）；与 CHM-16 的适用范围不同，故分列。","example":"对所用药材另行检测了重金属及有害元素（铅、镉、砷、汞，ICP-MS法）、农药残留（GC-MS/MS法）和微生物限度（平板计数法），检验方法依据《中国药典》（2020年版）相关通则。","arriveRef":"9a","prev":{"components":[{"code":"CHI-30","label":"质控检测类型","N":399,"yes":13,"no":41,"na":345,"unclear":0,"applicable":54,"rate":24.1}],"note":null,"merged":false}},{"id":"CHM-16","title":"质量控制结果判定","req":"如报告质量控制检测，应说明各项检测结果的验收标准及是否合格；存在不合格材料时，报告处理方式。","table":2,"set":"E10","arrive":"9a","section":"一、中药干预——物料与制备链","n":16,"why":"做了检测不等于合格，没有验收标准和判定结论，检测数据无法解读。","example":"上述检测结果均符合《中国药典》（2020年版）对该药材的限度规定，判定为合格；其中1个批次（批号：××）微生物限度不合格，已弃用并更换新批次。","arriveRef":"9a","prev":{"components":[{"code":"CHI-31","label":"质控结果判定","N":399,"yes":21,"no":34,"na":342,"unclear":2,"applicable":55,"rate":38.2}],"note":null,"merged":false}},{"id":"CHM-17","title":"证候名称","req":"若研究涉及中医证候或病证结合模型，应报告所研究中医证候的具体名称。","table":2,"set":"E10","arrive":"9a","section":"二、动物模型","n":17,"why":"证候名称属于本研究所建动物模型的内容，不同于 ARRIVE 8b 所指“动物进入本研究前”的背景信息，故归入 9a。","example":"本研究建立的是脾气虚证大鼠模型；中医证候名称：脾气虚证。","arriveRef":"9a","prev":{"components":[{"code":"CHI-05","label":"证候具体名称","N":399,"yes":12,"no":0,"na":387,"unclear":0,"applicable":12,"rate":100.0}],"note":null,"merged":false}},{"id":"CHM-18","title":"造模方法","req":"若疾病、证候或病证结合造模由研究者实施，应报告具体造模方法，包括诱导手段、流程及关键操作步骤。","table":2,"set":"E10","arrive":"9a","section":"二、动物模型","n":18,"why":"证候模型尚无公认统一的制备规范，同一证候可由多种方法诱导；不报告具体流程，模型就无法复现。","example":"脾气虚证模型采用“劳倦过度＋饮食失节”复合法：大鼠每日游泳至力竭（水温25±1℃，尾部负重为体重的5%），同时隔日禁食、次日自由进食，连续14 d。空白对照组不作处理，正常饲养。","arriveRef":"9a","prev":{"components":[{"code":"CHI-06","label":"造模方法","N":399,"yes":357,"no":7,"na":35,"unclear":0,"applicable":364,"rate":98.1}],"note":null,"merged":false}},{"id":"CHM-19","title":"模型验证","req":"若研究使用疾病、证候或病证结合的动物模型，应报告验证模型所用的指标或方法。","table":2,"set":"E10","arrive":"9a","section":"二、动物模型","n":19,"why":"造模成功的判定阈值归 3a（CHM-01），验证模型所用的指标或方法归 9a 动物模型，两者切面不同。","example":"造模第15天，通过摄食量、体重、大便性状、活动度和毛色的综合评分，并检测血清D-木糖排泄率验证模型；模型组与空白组相比差异有统计学意义（P<0.05）。","arriveRef":"9a","prev":{"components":[{"code":"CHI-08","label":"造模成功判定","N":399,"yes":266,"no":99,"na":34,"unclear":0,"applicable":365,"rate":72.9}],"note":"原条目为“判定造模成功或验证模型”的合并表述，现已拆分并收窄，数据仅作参考。","merged":false}},{"id":"CHM-20","title":"对照物组成与用量","req":"若设置涉及药物或其他物质干预的对照组，应报告对照物的名称、组成及剂量；安慰剂报告各辅料成分名称及用量，阳性药或其他药物对照报告具体药物名称、生产厂家（或供应商）、批号及剂量。","table":2,"set":"E10","arrive":"9a","section":"三、干预实施","n":20,"why":"对照物的组成是效应的参照系；阳性药多为上市制剂，其厂家和批号同样影响可比性。","example":"模型对照组按与受试药相同体积灌胃给予蒸馏水；安慰剂组给予含淀粉3%、糊精1%、焦糖色素0.1%（w/v）的混悬液；阳性药组给予××颗粒（××药业有限公司，批号：××，规格：每袋10 g），剂量3.5 g/kg（按生药折算）。","arriveRef":"9a","prev":{"components":[{"code":"CHI-32","label":"对照物组成","N":399,"yes":234,"no":12,"na":153,"unclear":0,"applicable":246,"rate":95.1}],"note":null,"merged":false}},{"id":"CHM-21","title":"安慰剂匹配","req":"如使用安慰剂，应说明其与受试药在外观、气味、口感、剂型和给药途径等特征上的匹配情况。","table":2,"set":"E10","arrive":"9a","section":"三、干预实施","n":21,"why":"动物实验中，安慰剂不匹配影响的主要是摄食与应激（气味、口感不同会直接改变摄入量），而不只是盲法。","example":"安慰剂以淀粉、糊精、焦糖色素及少量中药气味剂配制，色泽（棕褐色）、浑浊度和气味与受试药一致；剂型（混悬液）与给药途径（灌胃）相同。口感未作匹配，已在局限性中说明。","arriveRef":"9a","prev":{"components":[{"code":"CHI-33","label":"安慰剂物理匹配","N":399,"yes":0,"no":2,"na":397,"unclear":0,"applicable":2,"rate":0.0}],"note":null,"merged":false}},{"id":"CHM-22","title":"造模方法的选择依据","req":"若疾病、证候或病证结合造模由研究者实施，应说明选择该造模方法（如有改进，含改进部分）的依据，如引用文献、既往方法、机制解释等。","table":1,"set":"E10","arrive":"9d","n":22,"why":"中医模型常在既有方法上自行改良，不说明依据，读者无法判断模型是否成立。括号用于同时覆盖沿用既有方法和有所改进两种情形。","example":"脾气虚证模型采用文献[15]报道的大黄灌胃联合力竭游泳法。与原方法相比，本研究将大黄水煎液灌胃剂量由10 g/kg调整为7 g/kg，依据为预实验中原剂量组动物死亡率偏高（3/10）。","arriveRef":"9d","prev":{"components":[{"code":"CHI-07","label":"造模依据","N":399,"yes":207,"no":157,"na":35,"unclear":0,"applicable":364,"rate":56.9}],"note":null,"merged":false}},{"id":"CHM-23","title":"干预方案的来源与加减依据","req":"应报告中药干预方案的理论、文献或传承出处；若为自拟方案，应明确说明；当采用个体化加减方或随证加减时，报告药味加减或药味用量调整的依据或标准。","table":1,"set":"E10","arrive":"9d","n":23,"why":"方案的依据来自经典、文献或师承，随证加减会使同名方剂实际组成不同；两者同属“这个方子凭什么这么开”，故合并。“剂量”一词留给 CHM-24，本条用“药味用量调整”。","example":"四君子汤出自《太平惠民和剂局方》，按原方药味组成。针对模型动物便溏、湿盛的表现，将茯苓用量由9 g调整为12 g，依据为“湿盛便溏者重用茯苓健脾渗湿”的用药原则（文献[9]）。","arriveRef":"9d","prev":{"components":[{"code":"CHI-15","label":"出处／来源","N":399,"yes":328,"no":71,"na":0,"unclear":0,"applicable":399,"rate":82.2},{"code":"CHI-16","label":"加减依据","N":399,"yes":4,"no":0,"na":395,"unclear":0,"applicable":4,"rate":100.0}],"note":null,"merged":true}},{"id":"CHM-24","title":"给药剂量与疗程的依据","req":"应报告确定给药剂量及疗程的依据，如人体等效剂量换算、既往文献、预实验结果、经验性设定等。","table":1,"set":"E10","arrive":"9d","n":24,"why":null,"example":"大鼠给药剂量按人体等效剂量换算：成人临床日用量33 g生药/60 kg，按体表面积折算系数6.3换算，约3.47 g生药/(kg·d)，取整为3.5 g/kg。疗程14 d，依据预实验结果及文献[12]确定。","arriveRef":"9d","prev":{"components":[{"code":"CHI-26","label":"剂量疗程依据","N":399,"yes":215,"no":184,"na":0,"unclear":0,"applicable":399,"rate":53.9}],"note":null,"merged":false}},{"id":"CHM-25","title":"背景中的中医理论依据","req":"对于单味中药、复方、中成药等干预，应在背景/引言中说明选择该干预的中医理论依据，如证候、治法、功效、药性、归经、方剂配伍原则等。","table":1,"set":"REC","arrive":"12a","n":25,"why":"与 CHM-28 共同构成“理论依据—干预—结果解释”的链条。","example":"四君子汤为补气健脾的基础方，主治脾气虚证。方中人参大补元气，白术健脾燥湿，茯苓渗湿健脾，甘草调和诸药，诸药合用以益气健脾。本研究拟观察其对脾气虚证模型大鼠肠道菌群的影响。","arriveRef":"12a","prev":{"components":[{"code":"CHI-04","label":"中医理论阐释","N":399,"yes":302,"no":97,"na":0,"unclear":0,"applicable":399,"rate":75.7}],"note":null,"merged":false}},{"id":"CHM-26","title":"造模相关的饲养环境或饮食","req":"若疾病、证候或病证结合动物模型的诱导依赖特定饲养环境或饮食（如寒冷、高脂饮食），应报告各组所处环境或饮食的关键参数，如温度、湿度、光照周期、饲养密度及持续时间等。","table":1,"set":"REC","arrive":"15","n":26,"why":"部分证候模型的诱导依赖特定饲养环境或饮食，这些参数既是造模条件也是潜在混杂因素。昼夜颠倒、单笼孤养是常见诱导手段，因此举例包含光照周期和饲养密度。","example":"寒证模型大鼠每日2 h置于4±1℃人工气候箱，其余时间与对照组同处22±2℃、相对湿度50±10%的饲养室。各组均为12 h/12 h光照周期（07:00开灯）、每笼3只，持续14 d。","arriveRef":"15","prev":null},{"id":"CHM-27","title":"证候评分用作人道终点","req":"若将中医证候评分（或其中的体征条目）用作人道终点，应说明评分的构成、预先设定的终止阈值及其依据。","table":1,"set":"REC","arrive":"16c","n":27,"why":"证候评分用作终点而无预设阈值，动物实际观察期会因观察者而异，既影响福利判断，也影响结局可比性。","example":"采用大鼠脾气虚证评分（摄食量、体重、大便性状、活动度、毛色，每项0–3分，满分15分）每日监测。预设终止阈值为评分≥12分，或体重较基线下降超过20%，达到阈值即实施安乐死；阈值依据文献[20]及本机构动物福利指南设定。","arriveRef":"16c","prev":null},{"id":"CHM-28","title":"讨论中的中医理论","req":"对于单味中药、复方、中成药等干预，应在讨论中运用中医理论，如中药功效、证候改善、药性、归经等，对研究结果进行解释，并可结合药效物质、现代药理机制等进行说明。","table":1,"set":"REC","arrive":"17a","n":28,"why":"结果若不回到中医理论，中药研究就只剩药理学叙述。结合现代药理为可选补充，不要求必须报告现代机制。","example":"四君子汤使脾气虚证大鼠的摄食量和体重得到恢复，与其“益气健脾”的功效相符：人参、白术补气健脾，茯苓渗湿健脾，共同改善脾失健运所致的食少、便溏。此外，该作用可能与方中人参皂苷Rb1等成分调节肠道菌群有关。","arriveRef":"17a","prev":{"components":[{"code":"CHI-35","label":"中医理论解读结果","N":399,"yes":64,"no":335,"na":0,"unclear":0,"applicable":399,"rate":16.0}],"note":null,"merged":false}},{"id":"CHM-29","title":"不良反应的机制解释","req":"若研究报告动物的不良反应或毒副作用，应对其进行机制层面的解释。","table":1,"set":"REC","arrive":"17a","n":29,"why":null,"example":"高剂量组3/10只大鼠出现足趾轻度肿胀。中医理论认为甘草味甘，量大则易壅滞助湿；现代药理研究提示，这可能与甘草次酸抑制11β-羟类固醇脱氢酶、导致钠水潴留有关。","arriveRef":"17a","prev":{"components":[{"code":"CHI-36","label":"不良反应机制解读","N":399,"yes":10,"no":15,"na":374,"unclear":0,"applicable":25,"rate":40.0}],"note":null,"merged":false}},{"id":"CHM-30","title":"中药研究特有的局限性","req":"应在讨论中说明与中药研究特点相关的局限性，如证候动物模型向人类证候转化的局限、复方多成分机制尚未完全阐明、药材质量控制、批次差异等。","table":1,"set":"REC","arrive":"17b","n":30,"why":null,"example":"本研究的局限性包括：（1）脾气虚证大鼠模型与临床脾气虚证患者的证候特征存在差距，结果向人群转化需谨慎；（2）四君子汤含多种成分，发挥作用的物质基础及机制尚未完全阐明；（3）药材来自单一批次，未评价批间差异对结果的影响。","arriveRef":"17b","prev":{"components":[{"code":"CHI-37","label":"中药特有局限性","N":399,"yes":114,"no":284,"na":0,"unclear":1,"applicable":398,"rate":28.6}],"note":null,"merged":false}},{"id":"CHM-31","title":"标题中的疾病与证候","req":"应在标题中明确报告研究对象所涉及的疾病和／或具体中医证候；涉及病证结合模型时，同时报告疾病名称与具体证候名称，避免两者混用。","table":1,"set":"EXT","arrive":"title","n":31,"why":null,"example":"题名示例：“四君子汤对脾气虚证大鼠肠道菌群的影响”（证候）；“参苓白术散对溃疡性结肠炎脾虚湿盛证模型大鼠的影响”（疾病＋证候，病证结合模型，病名与证名分别写出）。","arriveRef":null,"prev":{"components":[{"code":"CHI-01","label":"研究对象类型","N":399,"yes":357,"no":13,"na":29,"unclear":0,"applicable":370,"rate":96.5}],"note":null,"merged":false}},{"id":"CHM-32","title":"标题中的干预名称","req":"应在标题中报告具体的中药干预名称，避免仅使用“中药”“中草药”“植物药”等泛称。","table":1,"set":"EXT","arrive":"title","n":32,"why":null,"example":"较好：“四君子汤对脾气虚证大鼠……的影响”（写出具体方名）。不够具体：“一种中药复方对……的影响”“中草药对……的影响”。","arriveRef":null,"prev":{"components":[{"code":"CHI-02","label":"标题中药名称","N":399,"yes":395,"no":4,"na":0,"unclear":0,"applicable":399,"rate":99.0}],"note":null,"merged":false}}]}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('app-data').textContent);
var ITEMS = D.items, N = ITEMS.length;
var BY = {}; ITEMS.forEach(function(i){ BY[i.id] = i; });
var SET_NAME = {E10:'核心十项', REC:'推荐条目', EXT:'框架外候选'};
var SET_FULL = {E10:'Essential 10　核心十项（1–10）', REC:'Recommended Set　推荐条目（11–21）', EXT:'框架外候选（保留原条目供审议）'};
/* Display switches: set to false to hide a block without touching anything else. */
var SHOW_PREVALENCE = true, SHOW_EXAMPLES = true;

var KEY = 'arrive-chm-delphi-r1-' + D.version;
var store = {profile:{}, answers:{}, additions:[], addSeq:0, updatedAt:null};
var canStore = true;
var ROWS = D.arriveRows, ROW_BY = {};
ROWS.forEach(function(r){ ROW_BY[r.id] = r; });
var REAL_ROWS = ROWS.filter(function(r){ return r.id !== 'title'; });
var EXT_N = REAL_ROWS.filter(function(r){ return r.ext; }).length, PLAIN_N = REAL_ROWS.length - EXT_N;
var viewExt = false, showEn = false;      /* table-1 display options (kept while the page is open) */
var RESET_LABEL = '清空我的答案与建议';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function paras(t){ return String(t||'').split('\n').filter(Boolean).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join(''); }
function pad(n){ return (n<10?'0':'')+n; }
function idToHash(id){ return 'chm-'+id.slice(4); }

function load(){
  try{
    var t = '__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); if(o && typeof o==='object'){
      store.profile=o.profile||{}; store.answers=o.answers||{}; store.updatedAt=o.updatedAt||null;
      store.additions = Array.isArray(o.additions) ? o.additions.filter(function(a){ return a && a.id; }) : [];
      store.addSeq = Math.max(Number(o.addSeq)||0, store.additions.length);
    } }
  }catch(e){ canStore = false; }
}
var saveTimer = null;
function persist(){
  store.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(store)); canStore = true; }catch(e){ canStore = false; }
  updateSaveNote();
}
function persistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 350); }
function ans(id){ if(!store.answers[id]) store.answers[id] = {score:null, cj:false, note:''}; return store.answers[id]; }
function isDone(id){ var a = store.answers[id]; return !!(a && (a.score != null || a.cj)); }
function doneCount(){ return ITEMS.filter(function(i){ return isDone(i.id); }).length; }
function hasNote(id){ var a = store.answers[id]; return !!(a && a.note && a.note.trim()); }
function hhmm(iso){ if(!iso) return ''; var d = new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function saveNoteText(){

/* ---------------- interactions ---------------- */
function currentId(){ var m = /^chm-(\d{2})$/i.exec(location.hash.replace(/^#/,'')); return m ? 'CHM-'+m[1] : null; }
function go(id){ location.hash = id ? idToHash(id) : 'overview'; }
function applyScore(v){
  var id = currentId(); if(!id) return; var a = ans(id);
  if(v === 'cj'){ a.cj = !a.cj; if(a.cj) a.score = null; }
  else { a.score = (a.score === v) ? null : v; if(a.score != null) a.cj = false; }
  persist();
  document.querySelectorAll('[data-score]').forEach(function(b){ b.setAttribute('aria-pressed', String(a.score === Number(b.getAttribute('data-score')))); });
  var c = document.querySelector('[data-cj]'); if(c) c.setAttribute('aria-pressed', String(!!a.cj));
  var d = document.getElementById('donecnt'); if(d) d.textContent = doneCount();
  var m = document.getElementById('dockmid'); if(m) m.innerHTML = dockText(BY[id]);
}
function navTo(kind){
  var id = currentId(); if(!id){ return; }
  var it = BY[id];
  if(kind === 'home') return go(null);
  if(kind === 'prev' && it.n > 1) return go(ITEMS[it.n-2].id);
  if(kind === 'next') return it.n < N ? go(ITEMS[it.n].id) : go(null);
}
function reduceMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

function scrollToEl(id){

document.addEventListener('click', function(e){

    if(ad){ ad[t.getAttribute('data-add-f')] = t.value; persistSoon(); refreshAddMarks(); }

document.addEventListener('change', function(e){
  var t = e.target;

  if(t.hasAttribute && t.hasAttribute('data-add-f') && t.tagName === 'SELECT'){ moveAddition(t.getAttribute('data-add-id'), t.value); return; }

document.addEventListener('keydown', function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'textarea' || tag === 'input' || tag === 'select') return;
  var id = currentId(); if(!id) return;
  if(/^[1-9]$/.test(e.key)){ applyScore(Number(e.key)); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ navTo('next'); }
  else if(e.key === 'ArrowLeft'){ navTo('prev'); }
  else if(e.key === 'Escape'){ navTo('home'); }
});

    var nAns = doneCount(), nSug = store.additions.filter(isFilled).length;
    if(nAns + nSug > 0){
      resumePending = o; resumeMsg = '此设备上已有 '+nAns+' 条评分、'+nSug+' 条建议，导入后会被文件内容替换。';
      renderOverview(); return;
    }
    applyResume(o);
  };
  fr.readAsText(f);
}
function applyResume(o){
  var ns = {profile:{}, answers:{}, additions:[], addSeq:0, updatedAt:null};
  var pr = o.profile || {}; Object.keys(pr).forEach(function(k){ ns.profile[k] = pr[k]; });
  (o.answers || []).forEach(function(a){
    if(!a || !BY[a.id]) return;
    var sc = (typeof a.importance === 'number' && a.importance >= 1 && a.importance <= 9) ? Math.round(a.importance) : null;
    var cj = !!a.cannotJudge && sc == null, note = String(a.note || '');
    if(sc != null || cj || note) ns.answers[a.id] = {score:sc, cj:cj, note:note};
  });
  (o.suggestions || o.additions || []).forEach(function(s){
    if(!s) return;
    var anchor = s.anchor; if(anchor !== 'outside' && !ROW_BY[anchor]) anchor = 'outside';
    ns.addSeq++; ns.additions.push({id:'a'+ns.addSeq, anchor:anchor, text:String(s.requirement != null ? s.requirement : (s.text || '')), reason:String(s.reason || '')});
  });
  store = ns; persist();
  resumePending = null;
  resumeMsg = '已导入答卷：已评分 '+doneCount()+' / '+N+'，建议 '+ns.additions.length+' 条，可继续填写。'
    + ((o.itemsVersion && o.itemsVersion !== D.version) ? '注意：该文件的条目稿版本（'+o.itemsVersion+'）与本页（'+D.version+'）不同，只导入了编号相同的条目。' : '');
  renderOverview(); window.scrollTo(0, 0);
}

/* ---------------- export ---------------- */
var RETURN_EMAIL = 'wangzhe19980611@163.com';   /* research-team address for the "write email" button and the address line; leave empty to hide both */
var DATA_BEGIN = '-----BEGIN ARRIVE-CHM DATA-----', DATA_END = '-----END ARRIVE-CHM DATA-----';
function b64(s){ var bytes = new TextEncoder().encode(s), bin = ''; for(var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin).replace(/(.{76})/g, '$1\n'); }
function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent || ''); }
function isMobileUA(){ var ua = navigator.userAgent || ''; return /Android|iPhone|iPad|iPod|HarmonyOS|OpenHarmony|Mobile/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function canShareFiles(){ try{ return !!(navigator.share && navigator.canShare && navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]})); }catch(e){ return false; } }
function payload(){
  var answers = ITEMS.map(function(it){ var a = store.answers[it.id] || {}; return {id:it.id, importance:(a.score!=null?a.score:null), cannotJudge:!!a.cj, note:(a.note||'').trim()}; });
  var rated = answers.filter(function(x){ return x.importance != null || x.cannotJudge; }).length;
  var suggestions = store.additions.filter(isFilled).map(function(a, i){
    return {no:i+1, kind:(a.anchor === 'outside' ? 'new' : 'extend'), anchor:a.anchor, anchorLabel:anchorLabel(a.anchor), requirement:(a.text||'').trim(), reason:(a.reason||'').trim()};
  });
  var profile = {}; Object.keys(store.profile).forEach(function(k){ profile[k] = store.profile[k]; });
  profile.name = (profile.name||'').trim(); profile.email = (profile.email||'').trim();
  return {schema:'arrive-chm-delphi-round1', schemaVersion:2, itemsVersion:D.version, scale:'1-9', exportedAt:new Date().toISOString(), totalItems:N, ratedCount:rated, complete:rated===N, profile:profile, answers:answers, suggestionsCount:suggestions.length, suggestions:suggestions};
}
function toText(p){
  var pr = p.profile || {}, L = [];
  L.push('ARRIVE-CHM 第一轮 Delphi 答卷（条目稿 '+p.itemsVersion+'）');
  L.push('专家姓名：'+(pr.name||'（未填）')+'　联系邮箱：'+(pr.email||'（未填）'));
  L.push('主要专家组：'+(pr.group||'（未填）')+'　熟悉程度：'+(pr.familiarity||'（未填）')+'　职称：'+(pr.title||'')+'　工作年限：'+(pr.years||'')+'　机构／地区：'+(pr.org||''));
  L.push('次要专长：'+((pr.secondary||[]).join('、')||'无')+'　判断依据：'+BASIS.map(function(b){ return b[1]+'＝'+((pr.basis||{})[b[0]]||'—'); }).join('，'));
  L.push('已评分 '+p.ratedCount+' / '+p.totalItems+'　导出时间：'+p.exportedAt);
  L.push('------');
  p.answers.forEach(function(a){ L.push(a.id+'｜'+(a.cannotJudge?'无法判断':(a.importance!=null?a.importance+' 分':'未评分'))+(a.note?'｜修改建议：'+a.note.replace(/\s*\n\s*/g,' '):'')); });
  [['extend','建议扩展的条目（仅作建议，本轮不评分）','建议扩展的报告要求'],['new','建议新增的条目（ARRIVE 框架之外；仅作建议，本轮不评分）','建议新增的报告要求']].forEach(function(g){
    var list = (p.suggestions||[]).filter(function(x){ return x.kind === g[0]; });
    L.push('------'); L.push(g[1]+'：共 '+list.length+' 条');
    list.forEach(function(x, i){
      L.push('['+(i+1)+'] 归属：'+x.anchorLabel);
      L.push('    '+g[2]+'：'+(x.requirement||'（未填）').replace(/\s*\n\s*/g,' '));
      if(x.reason) L.push('    理由或依据：'+x.reason.replace(/\s*\n\s*/g,' '));
    });
  });
  return L.join('\n');
}
function ymd(){ var d = new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function setStatus(msg, err){ var s = document.getElementById('expstatus'); if(s){ s.textContent = msg; s.classList.toggle('err', !!err); } }
function showFallback(text){
  var f = document.getElementById('expfallback'); if(!f) return;
  f.hidden = false; f.innerHTML = '<textarea class="fallback" id="fbta" readonly></textarea>';
  var ta = document.getElementById('fbta'); ta.value = text; ta.focus(); ta.select();
}
async function saveFile(name, text, mime){
  var framed = !!(window.claude && window.claude.use);
  if(framed){
    try{ var dl = await window.claude.use('downloads'); if(dl){ await dl.save({filename:name, data:text}); return 'saved'; } }
    catch(e){ if(e && e.code === 'declined') return 'declined'; }
    return 'unsupported';
  }
  try{
    var blob = new Blob([text], {type:mime}), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000); return 'saved';
  }catch(e){ return 'failed'; }
}
function needProfile(){
  var p = store.profile;
  if((p.name||'').trim() && validEmail(p.email)) return false;
  setStatus('请先在页面上方“专家信息”中填写专家姓名和有效的联系邮箱，研究团队据此识别您的答卷。', true);
  var box = document.getElementById('pfbox'); if(box){ box.open = true; scrollToEl('pfbox'); }
  return true;
}
async function doExport(kind){
  if(kind === 'copyaddr'){
    var ok0 = false; try{ await navigator.clipboard.writeText(RETURN_EMAIL); ok0 = true; }catch(e){}
    setStatus(ok0 ? '已复制邮箱 '+RETURN_EMAIL+'。' : '无法自动复制，请手动选取上方邮箱地址。', !ok0); return;
  }
  if(needProfile()) return;
  var p = payload(), d = new Date();
  var nm = p.profile.name.replace(/[\\\/:*?"<>|\s]+/g,'_');
  var base = 'ARRIVE-CHM-R1_'+nm+'_'+ymd()+'-'+pad(d.getHours())+pad(d.getMinutes());
  var json = JSON.stringify(p, null, 2);
  var note = (p.ratedCount < N ? '（尚有 '+(N-p.ratedCount)+' 条未评分；可先发送当前进度，之后再发新文件即可替换）' : '') + (p.suggestionsCount ? '（含 '+p.suggestionsCount+' 条建议）' : '');
  if(kind === 'copy'){
    var txt = toText(p) + '\n\n' + DATA_BEGIN + '\n' + b64(JSON.stringify(p)) + '\n' + DATA_END + '\n（上面的数据块供研究组导入答卷，请勿修改或删除）', ok = false;
    try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
    if(ok){ setStatus('已复制答卷文本（末尾含供研究组导入的数据块，请勿删改），可粘贴到邮件正文中发给研究团队。'+note); document.getElementById('expfallback').hidden = true; }
    else { setStatus('无法自动复制，请在下方文本框中全选并复制。'+note); showFallback(txt); }
    return;
  }
  if(kind === 'submit'){
    if(!RETURN_EMAIL) kind = 'json';
    else if(isMobileUA() && canShareFiles()){
      var cp = Promise.resolve(false);
      try{ cp = navigator.clipboard.writeText(RETURN_EMAIL).then(function(){ return true; }, function(){ return false; }); }catch(e){}
      try{
        await navigator.share({files:[new File([json], base+'.json', {type:'application/json'})], title:'ARRIVE-CHM 第一轮德尔菲答卷（'+p.profile.name+'）', text:'老师好，请见附件答卷文件。\n'+p.profile.name});
        var copied = await cp;
        setStatus('已打开分享面板。请选择邮件类应用，收件人填 '+RETURN_EMAIL+(copied ? '（该地址已复制，可直接粘贴）' : '（可点上方“复制邮箱”）')+'，确认已带上答卷文件后发送。邮件发出才算提交成功。'+note);
        return;
      }catch(e){
        if(e && e.name === 'AbortError'){ setStatus('已取消。需要时请再次点“提交答卷”。'); return; }
        kind = 'mail';
      }
    } else kind = 'mail';
  }
  if(kind === 'share'){
    try{
      await navigator.share({files:[new File([json], base+'.json', {type:'application/json'})], title:'ARRIVE-CHM 第一轮德尔菲答卷', text:'答卷文件（'+p.profile.name+'）'});
      setStatus('已打开分享面板，请选择邮件或微信发给研究团队。'+note);
    }catch(e){
      if(e && e.name === 'AbortError') setStatus('已取消分享。');
      else setStatus('此设备无法直接分享，请改用“下载答卷文件”。', true);
    }
    return;
  }
  if(kind === 'mail'){
    var rm = await saveFile(base+'.json', json, 'application/json');
    if(rm !== 'saved'){ setStatus(rm === 'declined' ? '已取消保存。' : '未能自动下载答卷文件。请展开下方“提交遇到问题？”，点“复制答卷文本”，粘贴到邮件正文发送。', true); return; }
    var a = document.createElement('a');
    a.href = 'mailto:'+RETURN_EMAIL+'?subject='+encodeURIComponent('ARRIVE-CHM 第一轮德尔菲答卷（'+p.profile.name+'）')+'&body='+encodeURIComponent('老师好：\n\n请见附件答卷文件（'+base+'.json，已下载到您的设备；请在邮件中添加为附件）。\n\n'+p.profile.name);
    document.body.appendChild(a); a.click(); a.remove();
    setStatus('答卷文件 '+base+'.json 已下载，并已尝试打开写给 '+RETURN_EMAIL+' 的邮件草稿。请把刚下载的文件添加为附件后发送；若没有弹出邮件软件（例如平时用网页邮箱），请登录自己的邮箱，新建邮件发给该地址并添加这个文件。邮件发出才算提交成功。'+note);
    return;
  }
  var r = await saveFile(base+'.json', json, 'application/json');
  if(r === 'saved') setStatus('已生成文件 '+base+'.json，请将它以邮件发到 '+RETURN_EMAIL+'。'+note+' 若没有反应，请改用“复制答卷文本”。');
  else if(r === 'declined') setStatus('已取消保存。');
  else { setStatus('此环境不支持直接下载，请改用“复制答卷文本”。', true); }
}
var resetArmed = false, resetTimer = null;
function doReset(btn){
  if(!resetArmed){ resetArmed = true; btn.textContent = '再点一次确认清空（不可恢复）'; btn.style.color = 'var(--danger)'; resetTimer = setTimeout(function(){ resetArmed = false; btn.textContent = RESET_LABEL; btn.style.color = ''; }, 4000); return; }
  clearTimeout(resetTimer); resetArmed = false;
  store = {profile:{}, answers:{}, additions:[], addSeq:0, updatedAt:null};
  try{ localStorage.removeItem(KEY); }catch(e){}
  renderOverview(); window.scrollTo(0,0);
}

function route(){
  var id = currentId();
  if(id && BY[id]){ renderItem(id); return; }
  var from = lastItem; lastItem = null;
  renderOverview();
  if(from){ var row = document.getElementById('row-'+from); var tile = document.querySelector('.tile[href="#'+idToHash(from)+'"]'); (row || tile) && (row || tile).scrollIntoView({block:'center'}); }
  else window.scrollTo(0,0);
}
load();
window.addEventListener('hashchange', route);
route();
})();
