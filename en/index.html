<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>ARRIVE-CHM Delphi Questionnaire</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.quote .en .lab{display:none}</style>

<style>
/* Layout concept: a calm reading desk. Overview = map of the 32 items + the two source tables;
   item page = ARRIVE context -> highlighted TCM requirement -> small supporting notes,
   with the scoring panel pinned beside it (desktop) or below it (phone). Jade ink on cool paper. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E8EFEB; --ink:#14211C; --muted:#4F5F58; --faint:#7A8A83;
  --line:#D5DFD9; --line-strong:#B4C4BB;
  --accent:#1A6853; --accent-hover:#124F3F; --accent-soft:#DAECE3; --on-accent:#FFFFFF;
  --set-e:#1A6853; --set-r:#37579A; --set-x:#8F6118;
  --set-e-soft:#DAECE3; --set-r-soft:#E0E8F6; --set-x-soft:#F4E6CE;
  --focus:#2A8C74; --danger:#A33A2A;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --surface-2:#1D2B26; --ink:#E5EEEA; --muted:#A3B3AC; --faint:#7F918A;
    --line:#26362F; --line-strong:#3B4F46;
    --accent:#58C0A1; --accent-hover:#7AD2B7; --accent-soft:#18372E; --on-accent:#08201A;
    --set-e:#58C0A1; --set-r:#8FA9E2; --set-x:#DDAE55;
    --set-e-soft:#18372E; --set-r-soft:#1C2A47; --set-x-soft:#3A2D14;
    --focus:#7AD2B7; --danger:#E58A78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface-2:#1D2B26; --ink:#E5EEEA; --muted:#A3B3AC; --faint:#7F918A;
  --line:#26362F; --line-strong:#3B4F46;
  --accent:#58C0A1; --accent-hover:#7AD2B7; --accent-soft:#18372E; --on-accent:#08201A;
  --set-e:#58C0A1; --set-r:#8FA9E2; --set-x:#DDAE55;
  --set-e-soft:#18372E; --set-r-soft:#1C2A47; --set-x-soft:#3A2D14;
  --focus:#7AD2B7; --danger:#E58A78; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
.btn.quiet:hover{color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- overview ---------- */
.masthead{padding-block:28px 8px}
.mh-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin:0 0 8px}
.mh-top .eyebrow{margin:0}
.langsw{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:99px;padding:2px;font-size:13.5px;line-height:1;background:var(--surface)}
.langsw>*{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:99px}
.langsw b{background:var(--accent);color:var(--on-accent);font-weight:600}
.langsw a{color:var(--muted);text-decoration:none;font-weight:600}
.langsw a:hover{color:var(--accent)}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600;margin:0 0 8px}
h1.title{font:700 clamp(24px,5.2vw,34px)/1.3 var(--serif);margin:0 0 10px;text-wrap:balance;letter-spacing:.01em}
.lede{margin:0;color:var(--muted);max-width:62ch}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px}
.meter{flex:1 1 220px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:120px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.progress b{font-variant-numeric:tabular-nums}
.savenote{font-size:13px;color:var(--faint)}
.savenote.warn{color:var(--danger)}

.panel{margin-top:22px}
.panel>h2,.section-title{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 10px}
details.fold{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:20px;color:var(--faint);line-height:1}
details.fold[open]>summary::after{content:"−"}
.fold-body{padding:4px 0 14px}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.notes b{color:var(--accent);min-width:5.2em}
.scoreguide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.scoreguide div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:13.5px;line-height:1.5}
.scoreguide b{display:block;font-size:15px}

/* map of 32 items */
.map{display:flex;flex-wrap:wrap;gap:16px 22px}
.seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg-label i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.seg-tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{--c:var(--set-e);--cs:var(--set-e-soft);width:40px;height:48px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative;font-variant-numeric:tabular-nums}
.tile.set-REC{--c:var(--set-r);--cs:var(--set-r-soft)}
.tile.set-EXT{--c:var(--set-x);--cs:var(--set-x-soft)}
.tile::before{content:"";position:absolute;left:6px;right:6px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.tile b{font-size:14px}
.tile small{font-size:12px;color:var(--faint);margin-top:2px}
.tile.done{background:var(--cs);border-color:var(--c)}
.tile.done small{color:var(--ink);font-weight:700}
.tile:hover{border-color:var(--c)}
.tile.noted::after{content:"";position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.mapnote{margin:12px 0 0;font-size:13px;color:var(--muted)}
.stats{margin:0 0 14px;color:var(--ink)}
.stats b{font-variant-numeric:tabular-nums}

/* tables */
.tbl{margin-top:30px}
.tbl>header{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.tbl>header h2{font:700 19px/1.4 var(--serif);margin:0}
.tbl>header p{margin:0;color:var(--muted);font-size:14px}
.grp{margin:22px 0 4px;font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px;color:var(--c)}
.grp::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.grp.set-E10{--c:var(--set-e)} .grp.set-REC{--c:var(--set-r)} .grp.set-EXT{--c:var(--set-x)}
.arow{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.arow-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.aid{font:700 15px var(--sans);color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.aname{font-weight:700}
.azh{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6}
.items{display:grid;gap:8px}
@media (min-width:760px){.arow{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:6px 28px}}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.item:hover{border-color:var(--accent)}
.item-id{font:700 13px var(--sans);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item-title{display:block;font-weight:700;line-height:1.45}
.item-req{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:2px}
.item-state{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:3.4em}
.badge{font-size:13px;font-weight:700;border-radius:99px;padding:1px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.sc{background:var(--accent);color:var(--on-accent)}
.badge.cj{background:var(--surface-2);color:var(--muted)}
.badge.none{color:var(--faint);font-weight:500;padding-right:0}
.tag-note{font-size:12px;color:var(--accent)}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.plain{margin-top:6px}
.plain summary{cursor:pointer;color:var(--muted);font-size:13.5px;min-height:40px;display:flex;align-items:center}
.plain-tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.plain-tags span{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--surface)}
.plain-tags b{color:var(--faint);margin-right:4px;font-weight:600}
.sec-sub{margin:20px 0 6px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline}
.sec-sub small{font-weight:500;color:var(--faint);font-size:13px}
.t2-list{display:grid;gap:8px;padding-top:6px}
.t2-zh{margin:10px 0 0;color:var(--muted);font-size:14px}

/* full ARRIVE panorama */
.pano{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px 10px;min-width:0}
.pcell h3{margin:0 0 7px;font-size:13px;font-weight:700;line-height:1.35;display:flex;gap:6px;align-items:baseline}
.pcell h3 b{color:var(--faint);font-variant-numeric:tabular-nums;min-width:1.2em}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{--c:var(--set-e);--cs:var(--set-e-soft);position:relative;min-width:44px;min-height:38px;padding:0 9px;border-radius:9px;border:1.5px dashed var(--line-strong);background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pchip.set-REC{--c:var(--set-r);--cs:var(--set-r-soft)} .pchip.set-EXT{--c:var(--set-x);--cs:var(--set-x-soft)}
.pchip.ext{border:1.5px solid var(--c);background:var(--cs);color:var(--c)}
.pchip small{font-size:11.5px;font-weight:700;background:var(--c);color:var(--surface);border-radius:99px;min-width:1.5em;padding:0 5px;line-height:1.5;text-align:center}
.pchip:hover{border-color:var(--c);color:var(--c)}
.pchip.add{border-style:solid;border-color:var(--accent);color:var(--accent);--c:var(--accent)}
.pchip.has-add::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.pchip.sample{min-width:34px;min-height:22px;padding:0;cursor:default;vertical-align:middle;margin-right:6px}
.pchip.sample.has-add::after{width:8px;height:8px;top:-3px;right:-3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 4px;font-size:13px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center}

/* table 1 toolbar, un-extended rows */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:12px 0 0}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.toggle button{min-height:40px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.toggle button+button{border-left:1px solid var(--line-strong)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.arow{scroll-margin-top:14px}
.arow.noext{padding:10px 0;border-bottom:1px dashed var(--line);align-content:start}
.arow.noext .aname{color:var(--muted)}
.arow.noext .aid{color:var(--faint)}
.noext-tag{font-size:12px;font-weight:600;color:var(--faint);border:1px dashed var(--line-strong);border-radius:99px;padding:0 9px;white-space:nowrap;line-height:1.7}
.aen{display:none;margin:5px 0 0;font:13px/1.6 var(--serif);color:var(--faint)}
.show-en .aen{display:block}
.aen .lab{font:700 11px var(--sans);letter-spacing:.08em;margin-right:6px}
.view-ext .arow.noext:not(.has-adds){display:none}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* expert-added suggestions */
.addzone{display:grid;gap:10px;min-width:0;align-content:start}
.addzone:empty{display:none}
.adds-act{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.addcard{border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface);padding:12px 14px 14px;display:grid;gap:6px;scroll-margin-top:14px}
.addcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.addcard-h b{font-size:14px;color:var(--accent)}
.addcard label.t{font-weight:700;font-size:13.5px;margin-top:4px}
.addcard .opt-note{font-weight:500;color:var(--faint)}
.addcard .addhint{margin:0 0 2px;font-size:12.5px;color:var(--muted)}
.addcard textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--bg);line-height:1.6;font-size:15px}
.addcard textarea.short{min-height:66px}
.addcard textarea:focus,.addcard select:focus{background:var(--surface)}
.addcard select{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;padding:0 10px;background:var(--bg);width:100%;min-width:0}
.addnote{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.65}
.t2-add{margin-top:24px;padding-top:14px;border-top:1px dashed var(--line-strong);display:grid;gap:10px}
.t2-add p{margin:0;font-size:14px;color:var(--muted)}
.chips button{font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--surface);cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
@media (min-width:760px){.arow.noext{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}

/* profile form */
.pf{display:grid;gap:16px;padding-top:8px}
.pf-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:grid;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=email]{min-height:44px;border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface);font-size:14px}
.opt input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.basis{display:grid;gap:8px}
.basis .brow{display:grid;grid-template-columns:minmax(7em,10em) 1fr;gap:10px;align-items:center}
@media (max-width:520px){.basis .brow{grid-template-columns:1fr}}
.pfstate{font-size:13px;font-weight:500;color:var(--faint)}
.pf-note{margin:0;font-size:13px;color:var(--muted)}
.pfstate.ok{color:var(--accent)}

/* export */
.export-box{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:grid;gap:12px}
.export-box h3{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid var(--line-strong);border-radius:99px;padding:1px 9px;color:var(--muted);background:var(--surface)}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.resume input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.resume-msg{color:var(--accent);font-weight:600}
.resume-msg.warn{color:var(--warn,#955A0C)}
.mailline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px}
.mailline b{user-select:all;word-break:break-all}
.btn.big{min-height:52px;padding:0 34px;font-size:17px}
.subfold{margin-top:4px}
.subfold .q{margin:0 0 10px}
details.resume-fold{margin-top:10px;font-size:13.5px;color:var(--muted)}
details.resume-fold>summary{cursor:pointer;padding:4px 0}
details.resume-fold .resume{margin-top:6px}
.wxwarn{margin:0 0 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--warn,#955A0C);color:var(--warn,#955A0C);font-size:14px;line-height:1.55}
.status{min-height:1.5em;font-size:14px;color:var(--accent)}
.mailcard{margin-top:12px;border:1px solid var(--line-strong);border-radius:12px;padding:14px 16px;background:var(--surface);font-size:14.5px;line-height:1.7}
.mailcard .mc-h{display:block;font-size:15.5px;margin-bottom:2px}
.mailcard ol{margin:6px 0 8px;padding-left:22px}
.mailcard li{margin:4px 0}
.mc-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:6px}
.mc-row .k{color:var(--muted);min-width:3.2em}
.mc-row b{word-break:break-all;user-select:all;font-weight:600}
.mc-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.mc-act a.btn{text-decoration:none}
.status.err{color:var(--danger)}
.privnote{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.rcpt{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.7}

ability/translation","en":""},{"id":"19","name":"Protocol registration","set":"REC","itemIds":[],"zh":"Provide a statement indicating whether a protocol (including the research question, key design features, and analysis plan) was prepared before the study, and if and where this protocol was registered.","ext":false,"main":"19","nameEn":"Protocol registration","en":""},{"id":"20","name":"Data access","set":"REC","itemIds":[],"zh":"Provide a statement describing if and where study data are available.","ext":false,"main":"20","nameEn":"Data access","en":""},{"id":"21a","name":"Declaration of interests","set":"REC","itemIds":[],"zh":"Declare any potential conflicts of interest, including financial and non-financial. If none exist, this should be stated.","ext":false,"main":"21","nameEn":"Declaration of interests","en":""},{"id":"21b","name":"Declaration of interests","set":"REC","itemIds":[],"zh":"List all funding sources (including grant identifier) and the role of the funder(s) in the design, analysis and reporting of the study.","ext":false,"main":"21","nameEn":"Declaration of interests","en":""},{"id":"title","name":"Title candidates","set":"EXT","itemIds":["Q31","Q32"],"zh":"ARRIVE 2.0 has no separate title item; ARRIVE item 11 concerns the abstract, so the candidates below do not belong directly under item 11.","ext":true}],"arriveMap":{"3a":{"id":"3a","set":"E10","nameZh":"Inclusion and exclusion criteria","nameEn":"Inclusion and exclusion criteria","zh":"Describe any criteria used for including and excluding animals (or experimental units) during the experiment, and data points during the analysis. Specify if these criteria were established a priori. If no criteria were set, state this explicitly.","en":"Describe any criteria used for including and excluding animals (or experimental units) during the experiment, and data points during the analysis. Specify if these criteria were established a priori. If no criteria were set, state this explicitly."},"4b":{"id":"4b","set":"E10","nameZh":"Randomisation","nameEn":"Randomisation","zh":"Describe the strategy used to minimise potential confounders such as the order of treatments and measurements, or animal/cage location. If confounders were not controlled, state this explicitly.","en":"Describe the strategy used to minimise potential confounders such as the order of treatments and measurements, or animal/cage location. If confounders were not controlled, state this explicitly."},"6a":{"id":"6a","set":"E10","nameZh":"Outcome measures","nameEn":"Outcome measures","zh":"Clearly define all outcome measures assessed (e.g. cell death, molecular markers, or behavioural changes).","en":"Clearly define all outcome measures assessed (e.g. cell death, molecular markers, or behavioural changes)."},"9a":{"id":"9a","set":"E10","nameZh":"Experimental procedures","nameEn":"Experimental procedures","zh":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (a) What was done, how it was done and what was used.","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (a) What was done, how it was done and what was used."},"9d":{"id":"9d","set":"E10","nameZh":"Experimental procedures","nameEn":"Experimental procedures","zh":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (d) Why (provide rationale for procedures).","en":"For each experimental group, including controls, describe the procedures in enough detail to allow others to replicate them, including: (d) Why (provide rationale for procedures)."},"12a":{"id":"12a","set":"REC","nameZh":"Background","nameEn":"Background","zh":"Include sufficient scientific background to understand the rationale and context for the study, and explain the experimental approach.","en":"Include sufficient scientific background to understand the rationale and context for the study, and explain the experimental approach."},"15":{"id":"15","set":"REC","nameZh":"Housing and husbandry","nameEn":"Housing and husbandry","zh":"Provide details of housing and husbandry conditions, including any environmental enrichment.","en":"Provide details of housing and husbandry conditions, including any environmental enrichment."},"16c":{"id":"16c","set":"REC","nameZh":"Animal care and monitoring","nameEn":"Animal care and monitoring","zh":"Describe the humane endpoints established for the study, the signs that were monitored and the frequency of monitoring. If the study did not have humane endpoints, state this.","en":"Describe the humane endpoints established for the study, the signs that were monitored and the frequency of monitoring. If the study did not have humane endpoints, state this."},"17a":{"id":"17a","set":"REC","nameZh":"Interpretation/scientific implications","nameEn":"Interpretation/scientific implications","zh":"Interpret the results, taking into account the study objectives and hypotheses, current theory and other relevant studies in the literature.","en":"Interpret the results, taking into account the study objectives and hypotheses, current theory and other relevant studies in the literature."},"17b":{"id":"17b","set":"REC","nameZh":"Interpretation/scientific implications","nameEn":"Interpretation/scientific implications","zh":"Comment on the study limitations including potential sources of bias, limitations of the animal model, and imprecision associated with the results.","en":"Comment on the study limitations including potential sources of bias, limitations of the animal model, and imprecision associated with the results."}},"table2Sections":["I. Chinese herbal intervention: materials and preparation chain","II. Animal model","III. Intervention delivery"],"items":[{"id":"Q01","title":"Inclusion and exclusion criteria for model animals","req":"If the study uses a disease, syndrome, or disease–syndrome combined animal model, report the criteria for including and excluding model animals before analysis, including the threshold used to judge successful model induction (e.g., a syndrome score, or a biochemical or pathological cut-off) and how animals that did not meet the threshold were handled.","table":1,"set":"E10","arrive":"3a","n":1,"why":"The success threshold determines which animals enter the analysis, so it acts as a sample-selection step; unless the criteria and the handling of animals that did not qualify are stated, readers cannot tell whether selection was selective.","example":"On day 14 of induction, Spleen-qi deficiency syndrome was scored (food intake, body-weight change, stool consistency, activity, and fur condition; 0–3 points each; maximum 15). Animals with a total score ≥ 8 and a body weight ≥ 10% lower than the blank group were judged successfully modelled and entered the dosing experiment. Animals not meeting the criteria (n = 4) were excluded and did not enter grouping or analysis.","arriveRef":"3a","prev":null},{"id":"Q02","title":"Control of batch confounding for the test material","req":"If the Chinese herbal materials, self-prepared intermediates, or final dosing preparations used in the study involve more than one batch (e.g., the experiment was run in stages, or the batch was changed during a long treatment course), describe the measures taken to avoid batch confounding, such as using a single batch number throughout or distributing animals of every group evenly across batches. If no such measures were taken, state this explicitly.","table":1,"set":"E10","arrive":"4b","n":2,"why":"Chinese herbal materials vary greatly between batches because of origin, harvest time, processing, and extraction, and are mostly prepared by the researchers themselves. When several batches are used, unless it is stated how batches map onto groups, batch differences become confounded with treatment effects.","example":"All experiments used the same batch of Huangqi (Astragali Radix) prepared slices (batch no. 20250312). One person decocted, concentrated, and freeze-dried them in a single run; the powder was aliquoted and stored at −20 °C, and every group received this batch. The experiment was run in two blocks; each block contained animals from all groups, with equal numbers per group.","arriveRef":"4b","prev":null},{"id":"Q03","title":"Methods for assessing TCM syndrome-related outcomes","req":"If signs, behaviours, or TCM syndrome scale scores are used as outcome measures to evaluate improvement of a TCM syndrome after the intervention — for example tongue appearance (where applicable), food intake, stool consistency, fur condition, or activity — describe the specific assessment method, such as the scoring criteria, the source of the scale, or the basis for judgement.","table":1,"set":"E10","arrive":"6a","n":3,"why":"There is no uniform objective measure of syndrome improvement; it is usually judged from signs, behaviours, or scale scores. Without the scoring criteria and the basis for judgement, readers cannot assess how reliable this outcome is.","example":"Improvement of Spleen-qi deficiency syndrome was evaluated by food intake, stool consistency, fur condition, and activity. The scoring criteria were developed with reference to the literature [12]: 0–3 points per item, with a higher total indicating a more severe syndrome. Two researchers blinded to group allocation scored independently, and the mean was used.","arriveRef":"6a","prev":{"components":[{"code":"CHI-33","label":"Method of assessing syndrome-related outcomes","N":385,"yes":5,"no":1,"na":379,"unclear":0,"applicable":6,"rate":83.3}],"note":null,"merged":false}},{"id":"Q04","title":"Name, botanical identity, and composition","req":"Report the specific name of the Chinese herbal intervention (a generic term such as “Chinese medicine” or “compound formula” alone is not acceptable). If the intervention has a defined dosage form, report the dosage form used. For a single herb or a compound formula (including their extracts), report each ingredient in turn: for plant-, fungus-, or animal-derived ingredients, report the Latin binomial of the source species (with authority), the medicinal part, and the place of origin (where the material was grown or collected); for mineral ingredients and ingredients without a biological source, report the standardized name in the standard relied upon (e.g., the Chinese Pharmacopoeia). For a compound formula, also report the prescribed amount of each ingredient. For a purchased finished product (e.g., a proprietary Chinese medicine), publicly available information on the product may be cited instead of listing every ingredient; if the composition or amounts cannot be disclosed or obtained (e.g., for confidentiality or patent reasons), state this and give the reason.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":4,"why":"Chinese medicine has many homonyms and synonyms for materials. An ingredient with a biological source must be fixed by the Latin binomial of the species (with authority) plus the medicinal part — for example, mulberry leaf, twig, and root bark come from the same species but are different medicinal materials. A compound formula whose composition is withheld cannot be replicated, so an exit is kept: declare it and give the reason.","example":"The intervention was Sijunzi Decoction (a decoction) made of four herbs: Renshen (ginseng; Panax ginseng C.A.Mey.; root and rhizome; origin: Fusong, Jilin) 9 g; Baizhu (Atractylodes macrocephala Koidz.; rhizome; origin: Pan’an, Zhejiang) 9 g; Fuling (Poria cocos (Schw.) Wolf; sclerotium; origin: Jinzhai, Anhui) 9 g; and Gancao (licorice; Glycyrrhiza uralensis Fisch.; root and rhizome; origin: Hangjin Banner, Inner Mongolia) 6 g; a total of 33 g crude herbs per dose.","arriveRef":"9a","prev":{"components":[{"code":"CHI-03","label":"Dosage form","N":385,"yes":189,"no":13,"na":183,"unclear":0,"applicable":202,"rate":93.6},{"code":"CHI-09","label":"CHM name in the full text","N":385,"yes":385,"no":0,"na":0,"unclear":0,"applicable":385,"rate":100.0},{"code":"CHI-10","label":"Intervention name in multiple languages","N":385,"yes":133,"no":177,"na":75,"unclear":0,"applicable":310,"rate":42.9},{"code":"CHI-11","label":"Names and doses of the component herbs","N":385,"yes":127,"no":62,"na":196,"unclear":0,"applicable":189,"rate":67.2},{"code":"CHI-12","label":"Herb names in multiple languages","N":385,"yes":115,"no":74,"na":196,"unclear":0,"applicable":189,"rate":60.8},{"code":"CHI-13","label":"Medicinal part","N":385,"yes":176,"no":66,"na":143,"unclear":0,"applicable":242,"rate":72.7},{"code":"CHI-14","label":"Place of origin","N":385,"yes":56,"no":186,"na":143,"unclear":0,"applicable":242,"rate":23.1},{"code":"CHI-24","label":"Latin name of the natural herbal material","N":385,"yes":94,"no":148,"na":143,"unclear":0,"applicable":242,"rate":38.8}],"note":null,"merged":true}},{"id":"Q05","title":"Raw-material form or type of processing","req":"When the intervention is not a ready-made proprietary Chinese medicine, report the type of material used (e.g., fresh or dried herb, prepared slices) and the preparation form (e.g., aqueous decoction, total extract, isolated fraction, or single compound).","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":5,"why":"The same herb prepared as fresh material, prepared slices, aqueous decoction, total extract, or single compound can differ completely in composition and efficacy.","example":"The material was purchased dried prepared slices (yinpian). The preparation form was a freeze-dried powder of the total extract, obtained by concentrating and freeze-drying the aqueous decoction of the slices; it was reconstituted in distilled water immediately before use.","arriveRef":"9a","prev":{"components":[{"code":"CHI-21","label":"Raw-material form of the product","N":385,"yes":321,"no":20,"na":44,"unclear":0,"applicable":341,"rate":94.1}],"note":null,"merged":false}},{"id":"Q06","title":"Source and batch number","req":"Report the supply source of the Chinese herbal materials or products. If obtained through a formal channel, report the manufacturer, supplier, or hospital pharmacy, together with the product batch number; if collected by the researchers, report the collection source.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":6,"why":"The quality of Chinese herbal materials fluctuates with origin, harvest year, and batch; the batch number is the identifier that links the study material to a specific lot of raw material.","example":"Prepared slices were purchased from XX Pharmaceutical Co., Ltd. Batch numbers: Renshen 2305016, Baizhu 2306112, Fuling 2304087, Gancao 2305203.","arriveRef":"9a","prev":{"components":[{"code":"CHI-17","label":"Supply source","N":385,"yes":341,"no":44,"na":0,"unclear":0,"applicable":385,"rate":88.6},{"code":"CHI-18","label":"Batch number","N":385,"yes":131,"no":234,"na":20,"unclear":0,"applicable":365,"rate":35.9}],"note":null,"merged":true}},{"id":"Q07","title":"Information on commercial finished products","req":"When a commercial finished product is used, report its specification (amount or content per unit package, with units) and its production date and/or expiry date.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":7,"why":"The specification determines whether the conversion from the finished product to the actual administered dose can be checked; the production and expiry dates reflect the condition of the drug at the time of dosing.","example":"The positive-control drug, XX Granules, was a commercial finished product (XX Pharmaceutical Co., Ltd.). Specification: 10 g per sachet, equivalent to 30 g of prepared slices. Production date: 12 March 2025; expiry date: 11 March 2027.","arriveRef":"9a","prev":{"components":[{"code":"CHI-19","label":"Product specification","N":385,"yes":16,"no":349,"na":20,"unclear":0,"applicable":365,"rate":4.4},{"code":"CHI-20","label":"Production date / expiry date","N":385,"yes":1,"no":364,"na":20,"unclear":0,"applicable":365,"rate":0.3}],"note":null,"merged":true}},{"id":"Q08","title":"Authentication and retained samples","req":"When Chinese herbal materials or prepared slices are used (including slices processed by the researchers themselves), report at least one of the following: the authenticator, the authenticating institution, the authentication method, or the identification items of the standard relied upon; and report how the voucher specimen or retained sample is kept (holding institution and accession number). When the researchers themselves produce a final product that can be stored, report whether a sample of the product was retained.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":8,"why":"Counterfeit and substituted materials are common in the herb trade; if identity is not confirmed, the intervention is uncertain. Reporting only that a sample was “retained”, without the holding institution and number, still does not allow traceability.","example":"The herbs were authenticated as genuine by Professor XXX, School of Pharmacy, XX University, on the basis of macroscopic and microscopic identification, using the identification items under the respective monograph of the Chinese Pharmacopoeia (2020 edition). The voucher specimens are deposited in the Herbarium of XX University, accession no. LZU-TCM-2025-0138.","arriveRef":"9a","prev":{"components":[{"code":"CHI-22","label":"Method of authenticating the raw material","N":385,"yes":93,"no":149,"na":143,"unclear":0,"applicable":242,"rate":38.4},{"code":"CHI-23","label":"Voucher specimen / retained sample","N":385,"yes":33,"no":215,"na":137,"unclear":0,"applicable":248,"rate":13.3}],"note":null,"merged":true}},{"id":"Q09","title":"Processing (paozhi)","req":"If a processing step was carried out by the researchers themselves, report the processing method (e.g., stir-frying, roasting with adjuvants, calcining, steaming, charring) and the processing standard relied upon (e.g., the general processing rules of the Chinese Pharmacopoeia, or local processing specifications); where adjuvants were used, report the type of adjuvant and its proportion; and state the degree of processing (e.g., stir-fried to yellow, to scorch, or to charcoal) or the specific heating temperature and duration.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":9,"why":"Processing changes composition and properties (for example, raw and prepared rehmannia, or raw and ginger-processed pinellia, differ in effect). If any of method, basis, adjuvant, or degree is missing, the process cannot be reproduced.","example":"Shudihuang (prepared rehmannia root) was processed by the researchers: raw rehmannia root was mixed evenly with yellow rice wine (30 kg wine per 100 kg raw root), sealed, and stewed over water until the liquid was absorbed and the material was black and glossy inside and out (about 24 h); it was then taken out, sun-dried until the surface mucilage was slightly dry, cut into thick slices, and dried. The processing method followed the wine-stewing method under the Shudihuang monograph of the Chinese Pharmacopoeia (2020 edition).","arriveRef":"9a","prev":{"components":[{"code":"CHI-45","label":"Name of the processing method","N":385,"yes":10,"no":0,"na":375,"unclear":0,"applicable":10,"rate":100.0},{"code":"CHI-46","label":"Adjuvants and their proportions","N":385,"yes":2,"no":3,"na":380,"unclear":0,"applicable":5,"rate":40.0},{"code":"CHI-47","label":"Degree of processing / heat control","N":385,"yes":4,"no":6,"na":375,"unclear":0,"applicable":10,"rate":40.0},{"code":"CHI-48","label":"Basis / standard for processing","N":385,"yes":3,"no":7,"na":375,"unclear":0,"applicable":10,"rate":30.0}],"note":null,"merged":true}},{"id":"Q10","title":"Extraction","req":"If the extraction step was carried out by the researchers themselves, report the type and concentration of the extraction solvent, the herb-to-solvent ratio (with units), the extraction mode (e.g., reflux, ultrasonic, decoction) and temperature, and the number and duration of extractions.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":10,"why":"Solvent, herb-to-solvent ratio, number of extractions, duration, and temperature jointly determine the chemical profile of the extract; reporting only one or two of them is not enough to reproduce the same extract.","example":"One kilogram of Sijunzi Decoction prepared slices was soaked in ten volumes of distilled water (herb-to-solvent ratio 1:10, kg/L) for 30 min and extracted by decoction at 100 °C twice for 1 h each; the two filtrates were combined.","arriveRef":"9a","prev":{"components":[{"code":"CHI-37","label":"Type and concentration of extraction solvent","N":385,"yes":177,"no":32,"na":176,"unclear":0,"applicable":209,"rate":84.7},{"code":"CHI-38","label":"Herb-to-solvent ratio","N":385,"yes":129,"no":80,"na":176,"unclear":0,"applicable":209,"rate":61.7},{"code":"CHI-39","label":"Number of extractions","N":385,"yes":142,"no":67,"na":176,"unclear":0,"applicable":209,"rate":67.9},{"code":"CHI-40","label":"Duration of each extraction","N":385,"yes":140,"no":69,"na":176,"unclear":0,"applicable":209,"rate":67.0},{"code":"CHI-41","label":"Extraction temperature / mode","N":385,"yes":173,"no":36,"na":176,"unclear":0,"applicable":209,"rate":82.8}],"note":null,"merged":true}},{"id":"Q11","title":"Concentration and drying","req":"If concentration or drying was carried out by the researchers themselves, report the specific method (e.g., vacuum concentration, atmospheric concentration, spray drying, freeze drying) and the end-point criterion (e.g., crude-herb equivalent, dry-extract yield, final volume).","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":11,"why":"The concentration and drying method affects the retention of heat-labile constituents; the end-point criterion (crude-herb equivalent, yield, etc.) is the basis for converting the amount of extract back to the amount of original herb.","example":"The combined filtrate was concentrated under reduced pressure on a rotary evaporator (50 °C, −0.09 MPa) to 2 g of crude herb per mL and then freeze-dried for 48 h to give a lyophilised powder; the dry-extract yield was 12.4% (dry extract weight / crude herb weight).","arriveRef":"9a","prev":{"components":[{"code":"CHI-42","label":"Mode of concentration","N":385,"yes":130,"no":68,"na":187,"unclear":0,"applicable":198,"rate":65.7},{"code":"CHI-43","label":"Endpoint of concentration","N":385,"yes":118,"no":80,"na":187,"unclear":0,"applicable":198,"rate":59.6}],"note":null,"merged":true}},{"id":"Q12","title":"Preparation of the final dosing formulation","req":"If the final dosing formulation was prepared by the researchers themselves, report for liquid formulations such as solutions and suspensions the type of vehicle and the final dosing concentration; for solid formulations such as granules and tablets, report the specific preparation process.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":12,"why":null,"example":"Before dosing, the lyophilised powder was dissolved in distilled water to a solution containing 0.35 g crude herb/mL, prepared freshly before each use and given by gavage at 10 mL/kg.","arriveRef":"9a","prev":{"components":[{"code":"CHI-44","label":"Reconstitution / suspension preparation","N":385,"yes":191,"no":175,"na":19,"unclear":0,"applicable":366,"rate":52.2}],"note":null,"merged":false}},{"id":"Q13","title":"Content of marker or active constituents","req":"When a standardized product is used, report the content of marker or active constituents, with units; when a single compound is used, report its purity.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":13,"why":null,"example":"The astragaloside IV content of the Astragalus extract used was 0.62 mg/g by HPLC; the single compound baicalin (XX Company) had a purity ≥ 98% (HPLC, area normalization).","arriveRef":"9a","prev":{"components":[{"code":"CHI-26","label":"Content of marker/active constituents","N":385,"yes":118,"no":105,"na":162,"unclear":0,"applicable":223,"rate":52.9}],"note":null,"merged":false}},{"id":"Q14","title":"Chemical characterisation methods and source of reference standards","req":"When chemical characterisation or quantitative analysis is carried out, report the analytical method and instruments used; when chemical reference standards, reference herbs, or reference extracts are used, report their source.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":14,"why":"Whether a content value or chromatographic profile can be trusted depends on the method, instrument, and the source of reference standards; without this information the data can neither be evaluated nor reproduced.","example":"Determination was by HPLC-DAD (Agilent 1260; C18 column, 250 mm × 4.6 mm, 5 μm; mobile phase: acetonitrile–0.1% phosphoric acid in water, gradient elution; detection wavelength 254 nm). The reference standard baicalin was purchased from the National Institutes for Food and Drug Control, China (batch no. XX).","arriveRef":"9a","prev":{"components":[{"code":"CHI-27","label":"Method of chemical characterisation","N":385,"yes":199,"no":7,"na":179,"unclear":0,"applicable":206,"rate":96.6},{"code":"CHI-28","label":"Source of chemical reference standards","N":385,"yes":64,"no":142,"na":179,"unclear":0,"applicable":206,"rate":31.1}],"note":null,"merged":true}},{"id":"Q15","title":"Quality-control testing items","req":"If quality-control testing is reported, state the specific testing items other than constituent content or single-compound purity, such as heavy metals and harmful elements, pesticide residues, microbial limits, residual solvents, or related substances, and state the test methods used.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":15,"why":"Quality-control tests (for example heavy metals, pesticide residues, microbial limits) reflect the safety and quality consistency of the test material; stating only that quality control was “passed” leaves readers unable to judge whether the testing was adequate or the methods sound.","example":"The herbs were additionally tested for heavy metals and harmful elements (lead, cadmium, arsenic, mercury; ICP-MS), pesticide residues (GC-MS/MS), and microbial limits (plate counting); the test methods followed the relevant general chapters of the Chinese Pharmacopoeia (2020 edition).","arriveRef":"9a","prev":{"components":[{"code":"CHI-29","label":"Type of quality-control testing","N":385,"yes":12,"no":41,"na":332,"unclear":0,"applicable":53,"rate":22.6}],"note":null,"merged":false}},{"id":"Q16","title":"Judgement of quality-control results","req":"If quality-control testing is reported, state the acceptance criteria for each test result and whether it passed; when non-conforming material was found, report how it was handled.","table":2,"set":"E10","arrive":"9a","section":"I. Chinese herbal intervention: materials and preparation chain","n":16,"why":"Having tested does not mean having passed; without acceptance criteria and a conclusion, test data cannot be interpreted.","example":"All results met the limits specified for the herb in the Chinese Pharmacopoeia (2020 edition) and were judged acceptable; one batch (batch no. XX) failed the microbial limit test, was discarded, and was replaced with a new batch.","arriveRef":"9a","prev":{"components":[{"code":"CHI-30","label":"Judgement of quality-control results","N":385,"yes":19,"no":34,"na":332,"unclear":0,"applicable":53,"rate":35.8}],"note":null,"merged":false}},{"id":"Q17","title":"Name of the TCM syndrome","req":"If the study involves a TCM syndrome or a disease–syndrome combined model, report the specific name of the TCM syndrome studied.","table":2,"set":"E10","arrive":"9a","section":"II. Animal model","n":17,"why":"Different syndromes imply different pathogenesis and presentations; if a study says only “syndrome model” without naming the specific syndrome, readers cannot tell which syndrome the model is meant to simulate.","example":"This study established a rat model of Spleen-qi deficiency syndrome; TCM syndrome name: Spleen-qi deficiency syndrome.","arriveRef":"9a","prev":{"components":[{"code":"CHI-05","label":"Specific name of the TCM syndrome","N":385,"yes":13,"no":0,"na":372,"unclear":0,"applicable":13,"rate":100.0}],"note":null,"merged":false}},{"id":"Q18","title":"Model-induction method","req":"If disease, syndrome, or disease–syndrome combined induction was carried out by the researchers, report the specific induction method, including the induction means, the procedure, and the key operational steps.","table":2,"set":"E10","arrive":"9a","section":"II. Animal model","n":18,"why":"There is no generally accepted standard procedure for preparing syndrome models, and one syndrome can be induced in several ways; without the specific procedure, the model cannot be reproduced.","example":"The Spleen-qi deficiency model was induced by a combined “overwork + irregular diet” method: rats swam daily to exhaustion (water temperature 25 ± 1 °C, tail load 5% of body weight) and were fasted on alternate days and fed freely on the following day, for 14 consecutive days. The blank control group was left untreated and housed normally.","arriveRef":"9a","prev":{"components":[{"code":"CHI-06","label":"Model-induction method","N":385,"yes":343,"no":6,"na":36,"unclear":0,"applicable":349,"rate":98.3}],"note":null,"merged":false}},{"id":"Q19","title":"Model validation","req":"If a disease, syndrome, or disease–syndrome combined animal model is used, report the indicators or methods used to validate the model.","table":2,"set":"E10","arrive":"9a","section":"II. Animal model","n":19,"why":"Whether the model is valid determines whether the efficacy findings can be trusted; stating only that the model was “successfully induced”, without the validation indicators or methods, leaves readers unable to judge model quality.","example":"On day 15 of induction, the model was validated by a composite score of food intake, body weight, stool consistency, activity, and fur condition, together with the serum D-xylose excretion rate; the model group differed significantly from the blank group (P < 0.05).","arriveRef":"9a","prev":{"components":[{"code":"CHI-08","label":"Criteria for successful modelling","N":385,"yes":256,"no":93,"na":36,"unclear":0,"applicable":349,"rate":73.4}],"note":"The original item was a combined statement (“judging successful model induction or validating the model”); it has since been split and narrowed, so the data are for reference only.","merged":false}},{"id":"Q20","title":"Composition and dose of control substances","req":"If a control group involving a drug or other substance is included, report the name, composition, and dose of the control substance; for a placebo, report the name and amount of each excipient; for a positive-control or other drug comparator, report the specific drug name, manufacturer (or supplier), batch number, and dose.","table":2,"set":"E10","arrive":"9a","section":"III. Intervention delivery","n":20,"why":"The composition of the control substance is the frame of reference for the effect; positive-control drugs are mostly marketed products whose manufacturer and batch also affect comparability.","example":"The model control group received distilled water by gavage in the same volume as the test drug; the placebo group received a suspension containing 3% starch, 1% dextrin, and 0.1% caramel colour (w/v); the positive-control group received XX Granules (XX Pharmaceutical Co., Ltd., batch no. XX, specification: 10 g per sachet) at 3.5 g/kg (calculated as crude herb).","arriveRef":"9a","prev":{"components":[{"code":"CHI-31","label":"Composition of the control substance","N":385,"yes":228,"no":12,"na":145,"unclear":0,"applicable":240,"rate":95.0}],"note":null,"merged":false}},{"id":"Q21","title":"Placebo matching","req":"If a placebo is used, describe how well it matches the test drug in appearance, smell, taste, dosage form, route of administration, and other characteristics.","table":2,"set":"E10","arrive":"9a","section":"III. Intervention delivery","n":21,"why":"In animal experiments, a mismatched placebo mainly affects food intake and stress (differences in smell and taste directly change intake), not only blinding.","example":"The placebo was prepared from starch, dextrin, caramel colour, and a small amount of herbal flavouring; its colour (brown), turbidity, and smell matched the test drug, and the dosage form (suspension) and route (gavage) were the same. Taste was not matched, which is stated in the limitations.","arriveRef":"9a","prev":{"components":[{"code":"CHI-32","label":"Physical matching of the placebo","N":385,"yes":0,"no":2,"na":383,"unclear":0,"applicable":2,"rate":0.0}],"note":null,"merged":false}},{"id":"Q22","title":"Rationale for the choice of model-induction method","req":"If disease, syndrome, or disease–syndrome combined induction was carried out by the researchers, state the rationale for choosing the induction method (including any modification), such as cited literature, previous methods, or mechanistic explanations.","table":1,"set":"E10","arrive":"9d","n":22,"why":"TCM models are often modified from existing methods; without a stated rationale, readers cannot judge whether the model is valid.","example":"The Spleen-qi deficiency model followed the rhubarb gavage plus exhaustive swimming method reported in the literature [15]. Compared with the original method, this study reduced the gavage dose of rhubarb decoction from 10 g/kg to 7 g/kg, because mortality in the original-dose group was high in a pilot experiment (3/10).","arriveRef":"9d","prev":{"components":[{"code":"CHI-07","label":"Rationale for model induction","N":385,"yes":201,"no":148,"na":36,"unclear":0,"applicable":349,"rate":57.6}],"note":null,"merged":false}},{"id":"Q23","title":"Source of the intervention protocol and basis for modifications","req":"Report the theoretical, literature, or inherited source of the Chinese herbal intervention; if the formula is self-devised, state this explicitly; when an individualized modified formula or syndrome-based modification is used, report the basis or criteria for adding, removing, or adjusting the amount of herbs.","table":1,"set":"E10","arrive":"9d","n":23,"why":"The basis of the protocol comes from the classics, the literature, or teacher–disciple lineage, and syndrome-based modification makes the actual composition of a formula of the same name differ; without stating the basis and the modifications, readers cannot tell which formula was actually used or on what grounds it was prescribed.","example":"Sijunzi Decoction is from Taiping Huimin Heji Ju Fang and was composed of the original herbs. In response to loose stools and dampness predominance in the model animals, the amount of Fuling was adjusted from 9 g to 12 g, on the principle that “for dampness predominance with loose stools, use more Fuling to strengthen the spleen and drain dampness” (literature [9]).","arriveRef":"9d","prev":{"components":[{"code":"CHI-15","label":"Provenance / source of the intervention","N":385,"yes":317,"no":68,"na":0,"unclear":0,"applicable":385,"rate":82.3},{"code":"CHI-16","label":"Basis for modification of a base formula","N":385,"yes":5,"no":21,"na":359,"unclear":0,"applicable":26,"rate":19.2}],"note":null,"merged":true}},{"id":"Q24","title":"Basis for dose and treatment duration","req":"Report the basis for determining the dose and treatment duration, such as human-equivalent dose conversion, previous literature, pilot results, or empirical setting.","table":1,"set":"E10","arrive":"9d","n":24,"why":null,"example":"The rat dose was converted from the human-equivalent dose: adult clinical daily dose 33 g crude herb per 60 kg; with a body-surface-area conversion factor of 6.3, this gives about 3.47 g crude herb/(kg·d), rounded to 3.5 g/kg. The treatment duration of 14 d was determined from pilot results and the literature [12].","arriveRef":"9d","prev":{"components":[{"code":"CHI-25","label":"Basis for dose and treatment duration","N":385,"yes":208,"no":177,"na":0,"unclear":0,"applicable":385,"rate":54.0}],"note":null,"merged":false}},{"id":"Q25","title":"TCM theoretical rationale in the background","req":"For interventions such as single herbs, compound formulas, and proprietary Chinese medicines, state in the background/introduction the TCM-theory rationale for choosing the intervention, such as syndrome, therapeutic principle, effect, nature and flavour, meridian tropism, or formula composition principles.","table":1,"set":"REC","arrive":"12a","n":25,"why":"The choice of a particular herb or formula is usually grounded in TCM theory (syndrome, treatment principle, efficacy, nature and flavour, meridian tropism, compatibility); if the background does not say so, readers cannot see why the intervention is reasonable.","example":"Sijunzi Decoction is a basic formula that tonifies qi and strengthens the spleen, indicated for Spleen-qi deficiency syndrome. In the formula, Renshen strongly tonifies the original qi, Baizhu strengthens the spleen and dries dampness, Fuling drains dampness and strengthens the spleen, and Gancao harmonizes the other herbs; together they boost qi and strengthen the spleen. This study aimed to observe its effect on the gut microbiota of rats with Spleen-qi deficiency syndrome.","arriveRef":"12a","prev":{"components":[{"code":"CHI-04","label":"TCM-theory rationale","N":385,"yes":280,"no":105,"na":0,"unclear":0,"applicable":385,"rate":72.7}],"note":null,"merged":false}},{"id":"Q26","title":"Housing environment or diet related to model induction","req":"If induction of a disease, syndrome, or disease–syndrome combined animal model depends on a specific housing environment or diet (e.g., cold, high-fat diet), report the key parameters of the environment or diet of each group, such as temperature, humidity, light cycle, housing density, and duration.","table":1,"set":"REC","arrive":"15","n":26,"why":"Induction of some syndrome models depends on a specific housing environment or diet; these parameters are both induction conditions and potential confounders. Reversed day–night cycles and single-housed isolation are common induction methods, so the examples include light cycle and housing density.","example":"Rats in the cold-syndrome model were placed in an artificial climate chamber at 4 ± 1 °C for 2 h per day and were otherwise housed with the control group in a room at 22 ± 2 °C and 50 ± 10% relative humidity. All groups had a 12 h/12 h light cycle (lights on at 07:00) and three rats per cage, for 14 d.","arriveRef":"15","prev":null},{"id":"Q27","title":"Syndrome score used as a humane endpoint","req":"If a TCM syndrome score (or one of its sign items) is used as a humane endpoint, state the composition of the score, the pre-specified termination threshold, and its basis.","table":1,"set":"REC","arrive":"16c","n":27,"why":"If a syndrome score is used as an endpoint without a pre-specified threshold, the actual observation period will vary with the observer, affecting both welfare judgements and the comparability of outcomes.","example":"The rat Spleen-qi deficiency score (food intake, body weight, stool consistency, activity, and fur condition; 0–3 points each; maximum 15) was monitored daily. The pre-specified termination threshold was a score ≥ 12 or body weight more than 20% below baseline; animals reaching the threshold were euthanised. The threshold was set on the basis of the literature [20] and the institutional animal welfare guidelines.","arriveRef":"16c","prev":null},{"id":"Q28","title":"TCM theory in the discussion","req":"For interventions such as single herbs, compound formulas, and proprietary Chinese medicines, use TCM theory in the discussion — such as the effects of the herbs, improvement of the syndrome, nature and flavour, and meridian tropism — to interpret the results; this may be supplemented by active constituents and modern pharmacological mechanisms.","table":1,"set":"REC","arrive":"17a","n":28,"why":"If results are not related back to TCM theory, Chinese medicine research is left with pharmacological narrative only.","example":"Sijunzi Decoction restored food intake and body weight in rats with Spleen-qi deficiency syndrome, consistent with its effect of “boosting qi and strengthening the spleen”: Renshen and Baizhu tonify qi and strengthen the spleen, and Fuling drains dampness and strengthens the spleen, jointly improving the poor appetite and loose stools caused by failure of the spleen to transport and transform. This effect may also be related to modulation of the gut microbiota by constituents such as ginsenoside Rb1.","arriveRef":"17a","prev":{"components":[{"code":"CHI-34","label":"Interpretation of results using TCM theory","N":385,"yes":75,"no":310,"na":0,"unclear":0,"applicable":385,"rate":19.5}],"note":null,"merged":false}},{"id":"Q29","title":"Mechanistic explanation of adverse reactions","req":"If adverse reactions or toxic side effects in animals are reported, provide an explanation at the mechanistic level.","table":1,"set":"REC","arrive":"17a","n":29,"why":null,"example":"Mild swelling of the toes occurred in 3/10 rats in the high-dose group. In TCM theory, licorice is sweet in flavour, and a large amount tends to cause stagnation and promote dampness; modern pharmacological studies suggest that this may be related to inhibition of 11β-hydroxysteroid dehydrogenase by glycyrrhetinic acid, leading to sodium and water retention.","arriveRef":"17a","prev":{"components":[{"code":"CHI-35","label":"Interpretation of the mechanism of adverse reactions","N":385,"yes":10,"no":14,"na":361,"unclear":0,"applicable":24,"rate":41.7}],"note":null,"merged":false}},{"id":"Q30","title":"Limitations specific to Chinese herbal medicine research","req":"State in the discussion the limitations related to the characteristics of Chinese herbal medicine research, such as limited translatability of syndrome animal models to human syndromes, incompletely elucidated multi-component mechanisms of compound formulas, quality control of the herbal materials, and batch variation.","table":1,"set":"REC","arrive":"17b","n":30,"why":null,"example":"Limitations of this study include: (1) the rat model of Spleen-qi deficiency syndrome differs from the syndrome characteristics of clinical patients, so translation of the results to humans should be cautious; (2) Sijunzi Decoction contains many constituents, and the material basis and mechanism of its action are not fully elucidated; (3) the herbs came from a single batch, and the effect of batch-to-batch variation on the results was not evaluated.","arriveRef":"17b","prev":{"components":[{"code":"CHI-36","label":"Limitations specific to CHM research","N":385,"yes":111,"no":274,"na":0,"unclear":0,"applicable":385,"rate":28.8}],"note":null,"merged":false}},{"id":"Q31","title":"Disease and syndrome in the title","req":"State in the title the disease and/or the specific TCM syndrome that the study concerns; for a disease–syndrome combined model, report both the disease name and the specific syndrome name, avoiding confusing the two.","table":1,"set":"EXT","arrive":"title","n":31,"why":null,"example":"Example titles: “Effects of Sijunzi Decoction on the gut microbiota of rats with Spleen-qi deficiency syndrome” (syndrome); “Effects of Shenling Baizhu San on rats with ulcerative colitis of the spleen deficiency with dampness predominance syndrome” (disease + syndrome; a disease–syndrome combined model, with the disease name and the syndrome name written separately).","arriveRef":null,"prev":{"components":[{"code":"CHI-01","label":"Type of study object","N":385,"yes":345,"no":14,"na":26,"unclear":0,"applicable":359,"rate":96.1}],"note":null,"merged":false}},{"id":"Q32","title":"Name of the intervention in the title","req":"Report the specific name of the Chinese herbal intervention in the title; avoid generic terms alone, such as “Chinese medicine”, “Chinese herbs”, or “botanical drug”.","table":1,"set":"EXT","arrive":"title","n":32,"why":null,"example":"Better: “Effects of Sijunzi Decoction on … in rats with Spleen-qi deficiency syndrome” (the specific formula name is given). Not specific enough: “Effects of a Chinese herbal compound on …”; “Effects of Chinese herbs on …”.","arriveRef":null,"prev":{"components":[{"code":"CHI-02","label":"CHM name in the title","N":385,"yes":381,"no":4,"na":0,"unclear":0,"applicable":385,"rate":99.0}],"note":null,"merged":false}}],"prevN":385}</script>

wxwarn: 'You are opening this page in WeChat’s built-in browser. Submitting should normally still work, but if submitting or downloading gives you trouble, tap “…” at the top right and choose “Open in browser” (or copy the link into your phone’s or computer’s own browser) before filling it in.',

h1: 'ARRIVE-CHM: a Chinese herbal medicine extension of the ARRIVE guidelines for animal experiments',
lede: function(N){ return 'Please rate the importance of each of the '+N+' candidate reporting requirements for Chinese herbal medicine (CHM). This survey asks what information should be reported in animal experiments on CHM, in order to improve transparency, reproducibility and interpretability; it does not assess the quality, results or efficacy of any particular experiment. If you think something is missing, you may suggest an extension under any ARRIVE item (including items that have no CHM extension yet); if something outside the ARRIVE framework needs to be reported, you may suggest a new item. Estimated time: 30–45 minutes; you can complete it in several sittings.'; },

notesSummary: 'Instructions',
notesBody: function(N){ return '<ul class="notes">'
  + '<li><b>What is rated</b><span>Items 1 to '+N+' are all candidate CHM extension reporting requirements, and each is rated independently. The original ARRIVE 2.0 requirements and category headings are not candidate items and are not rated.</span></li>'
  + '<li><b>Numbering</b><span>Items are numbered consecutively from 1 to '+N+' in the order they appear in the tables, which follows the order of the ARRIVE items.</span></li>'
  + '<li><b>Extensions and new items</b><span>If you think an ARRIVE item (including those marked “Not extended”) needs a CHM extension, click “Suggest an extension” under that item in Table 1. If a CHM reporting requirement does not belong under any ARRIVE item, suggest a new item under “Outside the ARRIVE framework” further down the page. These suggestions are not rated in this round: the research team will collate and de-duplicate them and check their basis, and suitable ones will enter the next round as new items.</span></li>'
  + '<li><b>Suggested revisions</b><span>If you think an item needs adjusting, write your final suggestion directly in its “Suggested revision” box: which ARRIVE item or topic it should move to, the wording you propose, and any specific plan to merge it, split it, or move it to the explanatory document.</span></li>'
  + '<li><b>Saving and submitting</b><span>Your answers are saved automatically in this device’s browser; close the page and reopen it in the same browser to continue. When you have finished, click “Submit responses” at the bottom of the page. Your responses are sent directly to the research team, and the page shows “Your responses have been received” when it has worked (you can edit and submit again afterwards — the last submission counts; if your network prevents direct submission, the page will guide you to send it by email instead). To continue on another phone, computer or browser, first click “Download response file only” under “Trouble submitting?” at the bottom of the page on the original device, then on the new device expand “Switched phone, computer or browser?” at the top of the page and import that file.</span></li></ul>'
  + '<div class="scoreguide"><div><b>1–3</b>Not important</div><div><b>4–6</b>Important but not critical, or uncertain</div><div><b>7–9</b>Critical; should be included</div></div>'
  + '<p class="q" style="margin:6px 0 0;font-size:13px;color:var(--muted)">Importance is rated on an integer scale of 1–9; if you cannot judge an item, choose “Cannot judge”.</p>'; },

var ITEMS = D.items, N = ITEMS.length;
var T2 = ITEMS.filter(function(i){ return i.table === 2; }), T2_RANGE = T2.length ? S.range(T2[0].n, T2[T2.length-1].n) : '';
var BY = {}; ITEMS.forEach(function(i){ BY[i.id] = i; });
var SET_FULL = S.setFull;
/* Display switches: set to false to hide a block without touching anything else. */
var SHOW_PREVALENCE = true, SHOW_EXAMPLES = true;

var KEY = 'arrive-chm-delphi-r1-' + D.version;
var store = {profile:{}, answers:{}, additions:[], addSeq:0, updatedAt:null, receipt:null};
var canStore = true;
var ROWS = D.arriveRows, ROW_BY = {};
ROWS.forEach(function(r){ ROW_BY[r.id] = r; });
var REAL_ROWS = ROWS.filter(function(r){ return r.id !== 'title'; });
var EXT_N = REAL_ROWS.filter(function(r){ return r.ext; }).length, PLAIN_N = REAL_ROWS.length - EXT_N;
var viewExt = false, showEn = false;      /* table-1 display options (kept while the page is open) */
var RESET_LABEL = S.resetLabel;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function paras(t){ return String(t||'').split('\n').filter(Boolean).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join(''); }
function pad(n){ return (n<10?'0':'')+n; }
function qLabel(it){ return S.qLabel(it.n); }
function lblOf(list, v){ var f = list.filter(function(x){ return x[0] === v; })[0]; return f ? f[1] : v; }
function normId(id){ var m = /^(?:CHM-|Q)0*(\d+)$/i.exec(String(id == null ? '' : id).trim()); return m ? 'Q'+pad(Number(m[1])) : id; }
function migrateAnswers(src){ var out = {}; Object.keys(src || {}).forEach(function(k){ out[normId(k)] = src[k]; }); return out; }
function idToHash(id){ return 'q'+id.slice(1); }

function load(){
  try{
    var t = '__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); if(o && typeof o==='object'){
      store.profile=o.profile||{}; store.answers=migrateAnswers(o.answers||{}); store.updatedAt=o.updatedAt||null;
      store.receipt = (o.receipt && o.receipt.sig) ? o.receipt : null;
      store.additions = Array.isArray(o.additions) ? o.additions.filter(function(a){ return a && a.id && isFilled(a); }) : [];
      store.addSeq = Math.max(Number(o.addSeq)||0, store.additions.length);
    } }
  }catch(e){ canStore = false; }
}
var saveTimer = null;
function persist(){
  store.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(store)); canStore = true; }catch(e){ canStore = false; }
  updateSaveNote();
}
function persistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 350); }
function ans(id){ if(!store.answers[id]) store.answers[id] = {score:null, cj:false, note:''}; return store.answers[id]; }
function isDone(id){ var a = store.answers[id]; return !!(a && (a.score != null || a.cj)); }
function doneCount(){ return ITEMS.filter(function(i){ return isDone(i.id); }).length; }
function hasNote(id){ var a = store.answers[id]; return !!(a && a.note && a.note.trim()); }
function hhmm(iso){ if(!iso) return ''; var d = new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function saveNoteText(){
  if(!canStore) return {t:S.saveNoStoreLong, w:true};
  if(!store.updatedAt) return {t:S.saveHint, w:false};
  return {t:S.saveAtLong(hhmm(store.updatedAt)), w:false};
}
function updateSaveNote(){
  var s = saveNoteText();
  document.querySelectorAll('[data-savenote]').forEach(function(el){ el.textContent = s.t; el.classList.toggle('warn', s.w); });
  var sv = document.getElementById('saved'); if(sv){ sv.textContent = !canStore ? S.saveNoStoreShort : (store.updatedAt ? S.saveAtShort(hhmm(store.updatedAt)) : ''); sv.classList.toggle('ok', canStore && !!store.updatedAt); }
}

/* ---------------- expert-added suggestions ----------------
   Suggestions are not rated in this round: they are free-text proposals anchored either to an
   ARRIVE sub-item (extended or not) or to "outside ARRIVE". They are autosaved and exported. */
function anchorLabel(a){
  if(a === 'outside') return S.anchorOutside;
  if(a === 'title') return S.anchorTitle;
  var r = ROW_BY[a]; return r ? 'ARRIVE '+r.id+' '+r.name : a;
}
function anchorOptions(sel){
  var h = '<option value="outside"'+(sel==='outside'?' selected':'')+'>'+esc(S.optOutside)+'</option>';
  S.optGroups.forEach(function(g){
    h += '<optgroup label="'+esc(g[1])+'">'+REAL_ROWS.filter(function(r){ return r.set === g[0]; }).map(function(r){
      return '<option value="'+r.id+'"'+(sel===r.id?' selected':'')+'>'+esc(S.optRow(r))+'</option>';
    }).join('')+'</optgroup>';
  });
  h += '<optgroup label="'+esc(S.optOther)+'"><option value="title"'+(sel==='title'?' selected':'')+'>'+esc(S.anchorTitle)+'</option></optgroup>';
  return h;
}
function delLabel(a){ return isFilled(a) ? S.del : S.cancel; }
function isFilled(a){ return !!(((a.text||'')+'').trim() || ((a.reason||'')+'').trim()); }
function addCount(){ return store.additions.filter(isFilled).length; }
function addById(id){ return store.additions.filter(function(x){ return x.id === id; })[0]; }
function addCardHTML(a){
  var k = a.id, isNew = a.anchor === 'outside';
  return '<div class="addcard" id="card-'+k+'" data-addcard="'+k+'">'
    + '<div class="addcard-h"><b>'+S.cardTitle(isNew)+' <span class="opt-note">'+S.optional+'</span></b><button class="btn quiet small" type="button" data-add-del="'+k+'">'+delLabel(a)+'</button></div>'
    + '<p class="addhint">'+S.cardHint+'</p>'
    + '<label class="t" for="ad'+k+'t">'+S.cardLabel(isNew)+'</label>'
    + '<textarea id="ad'+k+'t" data-add-f="text" data-add-id="'+k+'" placeholder="'+esc(S.cardPh(isNew))+'">'+esc(a.text||'')+'</textarea>'
    + '<label class="t" for="ad'+k+'r">'+S.reasonLabel+' <span class="opt-note">'+S.optional+'</span></label>'
    + '<textarea class="short" id="ad'+k+'r" data-add-f="reason" data-add-id="'+k+'" placeholder="'+esc(S.reasonPh)+'">'+esc(a.reason||'')+'</textarea>'
    + '<label class="t" for="ad'+k+'a">'+S.whereLabel+' <span class="opt-note">'+S.whereNote+'</span></label>'
    + '<select id="ad'+k+'a" data-add-f="anchor" data-add-id="'+k+'">'+anchorOptions(a.anchor)+'</select></div>';
}
function zoneHTML(anchor){
  var list = store.additions.filter(function(a){ return a.anchor === anchor; });
  var r = ROW_BY[anchor], plain = anchor === 'outside' || (r && !r.ext && anchor !== 'title');
  var label = S.zoneBtn(anchor === 'outside', list.length > 0, plain);
  return list.map(addCardHTML).join('')
    + '<div class="adds-act"><button class="btn small'+(plain?'':' quiet')+'" type="button" data-add="'+anchor+'">'+label+'</button></div>';
}
function zone(anchor){ return '<div class="addzone" id="zone-'+anchor+'" data-zone="'+anchor+'">'+zoneHTML(anchor)+'</div>'; }
function refreshAddMarks(){
  var any = {}, filled = {};
  store.additions.forEach(function(a){ any[a.anchor] = true; if(isFilled(a)) filled[a.anchor] = (filled[a.anchor]||0)+1; });
  var actCard = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-addcard]') : null;
  var actAd = actCard ? addById(actCard.getAttribute('data-addcard')) : null, actAnchor = actAd ? actAd.anchor : null;
  document.querySelectorAll('[data-row]').forEach(function(el){ var rk = el.getAttribute('data-row'); el.classList.toggle('has-adds', !!filled[rk] || rk === actAnchor); });
  document.querySelectorAll('[data-chip]').forEach(function(el){ el.classList.toggle('has-add', !!filled[el.getAttribute('data-chip')]); });
  var on = document.querySelector('[data-outside-n]'); if(on){ var n = filled.outside || 0; on.textContent = n; on.hidden = !n; }
  updateExportSummary();
}
function renderZones(){
  document.querySelectorAll('[data-zone]').forEach(function(z){ z.innerHTML = zoneHTML(z.getAttribute('data-zone')); });
  refreshAddMarks();
}
function pruneEmpty(keepId){
  var n = store.additions.length;
  store.additions = store.additions.filter(function(a){ return isFilled(a) || a.id === keepId; });
  if(store.additions.length !== n){ persist(); renderZones(); return true; }
  return false;
}
function addSuggestion(anchor){
  var empty = store.additions.filter(function(a){ return a.anchor === anchor && !isFilled(a); })[0];
  if(empty){
    pruneEmpty(empty.id);
    var ex = document.getElementById('ad'+empty.id+'t'); if(ex){ ex.focus({preventScroll:true}); ex.scrollIntoView({block:'center', behavior:'auto'}); }
    return;
  }
  pruneEmpty(null);
  var seq = store.addSeq || 0, id;
  do { seq++; id = 'a'+seq; } while(addById(id));
  store.addSeq = seq;
  store.additions.push({id:id, anchor:anchor, text:'', reason:''});
  persist(); renderZones();
  var ta = document.getElementById('ad'+id+'t');
  if(ta){ ta.focus({preventScroll:true}); ta.scrollIntoView({block:'center', behavior:'auto'}); }
}
var delArmed = null, delTimer = null;
function delAddition(btn, id){
  var a = addById(id); if(!a) return;
  if(isFilled(a) && delArmed !== id){
    delArmed = id; btn.textContent = S.confirmDel; btn.style.color = 'var(--danger)';
    clearTimeout(delTimer); delTimer = setTimeout(function(){ delArmed = null; btn.textContent = delLabel(a); btn.style.color = ''; }, 4000);
    return;
  }
  delArmed = null; clearTimeout(delTimer);
  store.additions = store.additions.filter(function(x){ return x.id !== id; });
  persist(); renderZones();
}
function moveAddition(id, anchor){
  var a = addById(id); if(!a || a.anchor === anchor) return;
  a.anchor = anchor; persist(); renderZones();
  var card = document.getElementById('card-'+id);
  if(card){ card.scrollIntoView({block:'center', behavior:'auto'}); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
}

function tileHTML(it){
  var a = store.answers[it.id] || {};
  var small = a.cj ? '?' : (a.score != null ? a.score : '·');
  return '<a class="tile set-'+it.set+(isDone(it.id)?' done':'')+(hasNote(it.id)?' noted':'')+'" href="#'+idToHash(it.id)+'" title="'+esc(qLabel(it)+' '+it.title)+'" aria-label="'+esc(qLabel(it)+' '+it.title)+'"><b>'+pad(it.n)+'</b><small>'+small+'</small></a>';
}
function itemCard(it){
  var a = store.answers[it.id] || {};
  var st = a.cj ? '<span class="badge cj">'+S.cj+'</span>' : (a.score != null ? '<span class="badge sc">'+a.score+'</span>' : '<span class="badge none">'+S.todo+'</span>');
  return '<a class="item" id="row-'+it.id+'" href="#'+idToHash(it.id)+'"><span class="item-id">'+qLabel(it)+'</span><span><span class="item-title">'+esc(it.title)+'</span><span class="item-req">'+esc(it.req.replace(/\n/g,' '))+'</span></span><span class="item-state">'+st+(hasNote(it.id)?'<span class="tag-note">'+S.hasNote+'</span>':'')+'</span></a>';
}

var GROUPS = S.groups, FAM = S.fam, BASIS = S.basis;
function radios(name, opts, val, extra){
  return '<div class="opts" role="radiogroup">'+opts.map(function(o){
    var v = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o;
    return '<label class="opt"><input type="radio" name="'+name+'" value="'+esc(v)+'" data-pf="'+esc(extra||name)+'"'+(val===v?' checked':'')+'><span>'+esc(l)+'</span></label>';
  }).join('')+'</div>';
}
function validEmail(s){ return /^[^\s@，,;；]+@[^\s@，,;；]+\.[^\s@，,;；]+$/.test(String(s||'').trim()); }
function profileDone(){ var p = store.profile; return !!((p.name||'').trim() && validEmail(p.email) && p.group && p.familiarity); }
