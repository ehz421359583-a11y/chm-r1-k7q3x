  var p = store.profile, b = p.basis || {}, sec = p.secondary || [];
  var h = '<div class="pf">';
  h += '<p class="pf-note">'+S.pfNote+'</p>';
  h += '<div class="pf-row"><div class="field"><label for="pf-name">'+S.pfName+'</label><input id="pf-name" type="text" data-pf="name" value="'+esc(p.name||'')+'" autocomplete="name"></div>';
  h += '<div class="field"><label for="pf-email">'+S.pfEmail+'</label><input id="pf-email" type="email" inputmode="email" data-pf="email" value="'+esc(p.email||'')+'" autocomplete="email" autocapitalize="off" spellcheck="false"></div>';
  h += '<div class="field"><label for="pf-title">'+S.pfTitle+'</label><input id="pf-title" type="text" data-pf="title" value="'+esc(p.title||'')+'" autocomplete="off"></div>';
  h += '<div class="field"><label for="pf-years">'+S.pfYears+'</label><input id="pf-years" type="number" inputmode="numeric" min="0" max="80" data-pf="years" value="'+esc(p.years||'')+'"></div>';
  h += '<div class="field"><label for="pf-org">'+S.pfOrg+'</label><input id="pf-org" type="text" data-pf="org" value="'+esc(p.org||'')+'" autocomplete="off"></div></div>';
  h += '<div class="field"><span class="lbl">'+S.pfGroup+'</span>'+radios('group', GROUPS, p.group)+'</div>';
  h += '<div class="field"><span class="lbl">'+S.pfSecondary+'</span><div class="opts">'+GROUPS.map(function(g){ return '<label class="opt"><input type="checkbox" value="'+esc(g[0])+'" data-pf="secondary"'+(sec.indexOf(g[0])>=0?' checked':'')+'><span>'+esc(g[1])+'</span></label>'; }).join('')+'</div></div>';
  h += '<div class="field"><span class="lbl">'+S.pfFam+'</span>'+radios('familiarity', FAM, p.familiarity)+'</div>';
  h += '<div class="field"><span class="lbl">'+S.pfBasis+'</span><div class="basis">'+BASIS.map(function(bk){

  renderReceipt();

function qlFilter(v){
  if(!qlEl) return;
  if(!QL_HAY){ QL_HAY = {}; ITEMS.forEach(function(i){ QL_HAY[i.id] = (i.title+' '+i.req).toLowerCase(); }); }
  var toks = String(v || '').toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
  qlEl.querySelectorAll('[data-qgo]').forEach(function(b){
    var hay = QL_HAY[b.getAttribute('data-qgo')] || '';
    var ok = toks.every(function(t){ return hay.indexOf(t) >= 0; });
    b.hidden = !ok; if(ok) shown++;
  });
  var none = qlEl.querySelector('.ql-none'); if(none) none.hidden = shown > 0;
  var cnt = qlEl.querySelector('#qlcount'); if(cnt) cnt.textContent = toks.length ? S.listShown(shown, N) : S.listRated(doneCount(), N);

/* ---------------- interactions ---------------- */
function currentId(){ var m = /^(?:q|chm-)(\d{2})$/i.exec(location.hash.replace(/^#/,'')); return m ? 'Q'+m[1] : null; }
function go(id){ location.hash = id ? idToHash(id) : 'overview'; }
function applyScore(v){
  var id = currentId(); if(!id) return; var a = ans(id);
  if(v === 'cj'){ a.cj = !a.cj; if(a.cj) a.score = null; }
  else { a.score = (a.score === v) ? null : v; if(a.score != null) a.cj = false; }
  persist();
  document.querySelectorAll('[data-score]').forEach(function(b){ b.setAttribute('aria-pressed', String(a.score === Number(b.getAttribute('data-score')))); });
  var c = document.querySelector('[data-cj]'); if(c) c.setAttribute('aria-pressed', String(!!a.cj));
  var d = document.getElementById('donecnt'); if(d) d.textContent = doneCount();
  var m = document.getElementById('dockmid'); if(m) m.innerHTML = dockText(BY[id]);
}
function navTo(kind){
  var id = currentId(); if(!id){ return; }
  var it = BY[id];
  if(kind === 'list') return openList();
  if(kind === 'home') return go(null);
  if(kind === 'prev' && it.n > 1) return go(ITEMS[it.n-2].id);
  if(kind === 'next') return it.n < N ? go(ITEMS[it.n].id) : go(null);
}
function reduceMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function setView(ext){
  pruneEmpty(null);
  viewExt = !!ext;
  var t1 = document.getElementById('table1'); if(t1) t1.classList.toggle('view-ext', viewExt);
  document.querySelectorAll('[data-view]').forEach(function(b){ b.setAttribute('aria-pressed', String((b.getAttribute('data-view') === 'ext') === viewExt)); });
}
function scrollToEl(id){
  var el = document.getElementById(id); if(!el) return;
  if(viewExt && el.offsetParent === null) setView(false);      /* target row was filtered out of table 1 */
  el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'});
  var f = el.classList.contains('arow') || el.classList.contains('addcard') ? el : null;
  if(f){ f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); }
}

document.addEventListener('click', function(e){
  var lg = e.target.closest ? e.target.closest('[data-lang-go]') : null;
  if(lg && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button)){
    e.preventDefault();
    clearTimeout(saveTimer); persist();   /* flush anything typed in the last moment, then open the other language page at the same question */
    try{ var u = new URL(lg.getAttribute('href'), location.href); u.hash = location.hash; location.assign(u.toString()); }catch(err){ location.assign(lg.getAttribute('href')); }
    return;
  }
  var inCard = e.target.closest ? e.target.closest('[data-addcard]') : null;
  if(!(e.target.closest && e.target.closest('[data-add]'))) pruneEmpty(inCard ? inCard.getAttribute('data-addcard') : null);
  var t = e.target.closest('[data-score],[data-cj],[data-nav],[data-scroll],[data-exp],[data-reset],[data-add],[data-add-del],[data-view],[data-resume],[data-qgo],[data-qclose]');
  if(!t) return;
  if(t.hasAttribute('data-qclose')) return closeList();
  if(t.hasAttribute('data-qgo')){ var gid = t.getAttribute('data-qgo'); var same = (gid === currentId()); closeList(); if(!same) go(gid); return; }
  if(t.hasAttribute('data-add')) return addSuggestion(t.getAttribute('data-add'));
  if(t.hasAttribute('data-add-del')) return delAddition(t, t.getAttribute('data-add-del'));
  if(t.hasAttribute('data-view')) return setView(t.getAttribute('data-view') === 'ext');
  if(t.hasAttribute('data-score')) return applyScore(Number(t.getAttribute('data-score')));
  if(t.hasAttribute('data-cj')) return applyScore('cj');
  if(t.hasAttribute('data-nav')) return navTo(t.getAttribute('data-nav'));
  if(t.hasAttribute('data-scroll')) return scrollToEl(t.getAttribute('data-scroll'));
  if(t.hasAttribute('data-exp')) return doExport(t.getAttribute('data-exp'), t);
  if(t.hasAttribute('data-reset')) return doReset(t);
  if(t.hasAttribute('data-resume')){
    if(t.getAttribute('data-resume') === 'yes' && resumePending) return applyResume(resumePending);
    resumePending = null; resumeMsg = S.importCancelled; renderOverview(); return;
  }
});
document.addEventListener('input', function(e){

  if(t.hasAttribute('data-add-f') && t.tagName === 'TEXTAREA'){
    var ad = addById(t.getAttribute('data-add-id'));
    if(ad){
      ad[t.getAttribute('data-add-f')] = t.value; persistSoon(); refreshAddMarks();
      var dbtn = document.querySelector('[data-add-del="'+ad.id+'"]'); if(dbtn && delArmed !== ad.id){ dbtn.textContent = delLabel(ad); }

});
document.addEventListener('keydown', function(e){
  if(qlEl){

document.addEventListener('keydown', function(e){

/* ---------------- resume from a downloaded answer file (other device / browser) ---------------- */
var resumeMsg = '', resumePending = null;
function resumeHTML(){
  var h = '<details class="resume-fold"'+((resumePending || resumeMsg) ? ' open' : '')+'><summary>'+S.resumeSummary+'</summary><div class="resume"><label class="btn small" for="resumefile">'+S.resumeBtn+'</label><input type="file" id="resumefile" accept=".json,application/json">';
  if(resumePending){
    h += '<span class="resume-msg warn" id="resumemsg" role="status" aria-live="polite">'+esc(resumeMsg)+'</span><button class="btn small primary" type="button" data-resume="yes">'+S.resumeConfirm+'</button><button class="btn small" type="button" data-resume="no">'+S.cancel+'</button>';
  } else {
    h += '<span class="resume-msg" id="resumemsg" role="status" aria-live="polite">'+esc(resumeMsg)+'</span>';
  }
  return h + '</div></details>';
}
function resumeFail(m){ resumePending = null; resumeMsg = m; var el = document.getElementById('resumemsg'); if(el){ el.textContent = m; el.classList.add('warn'); } }
function readResume(f){
  var fr = new FileReader();
  fr.onerror = function(){ resumeFail(S.rErrRead); };
  fr.onload = function(){
    var o; try{ o = JSON.parse(String(fr.result).replace(/^﻿/, '')); }catch(e){ return resumeFail(S.rErrJson); }
    if(!o || o.schema !== 'arrive-chm-delphi-round1' || !Array.isArray(o.answers)) return resumeFail(S.rErrNotOurs);
    var nAns = doneCount(), nSug = store.additions.filter(isFilled).length;
    if(nAns + nSug > 0){
      resumePending = o; resumeMsg = S.rHave(nAns, nSug);
      renderOverview(); return;
    }
    applyResume(o);
  };
  fr.readAsText(f);
}
function applyResume(o){
  var ns = {profile:{}, answers:{}, additions:[], addSeq:0, updatedAt:null};
  var pr = o.profile || {}; Object.keys(pr).forEach(function(k){ ns.profile[k] = pr[k]; });
  (o.answers || []).forEach(function(a){
    if(!a) return;
    var aid = normId(a.id); if(!BY[aid]) return;
    var sc = (typeof a.importance === 'number' && a.importance >= 1 && a.importance <= 9) ? Math.round(a.importance) : null;
    var cj = !!a.cannotJudge && sc == null, note = String(a.note || '');
    if(sc != null || cj || note) ns.answers[aid] = {score:sc, cj:cj, note:note};
  });
  (o.suggestions || o.additions || []).forEach(function(s){
    if(!s) return;
    var anchor = s.anchor; if(anchor !== 'outside' && !ROW_BY[anchor]) anchor = 'outside';
    ns.addSeq++; ns.additions.push({id:'a'+ns.addSeq, anchor:anchor, text:String(s.requirement != null ? s.requirement : (s.text || '')), reason:String(s.reason || '')});
  });
  store = ns; persist();
  resumePending = null;
  resumeMsg = S.rDone(doneCount(), N, ns.additions.length)
    + ((o.itemsVersion && o.itemsVersion !== D.version) ? S.rVer(o.itemsVersion, D.version) : '');
  renderOverview(); window.scrollTo(0, 0);
}

/* ---------------- export ---------------- */
var RETURN_EMAIL = 'wangzhe19980611@163.com';   /* research-team address for the "write email" button and the address line; leave empty to hide both */
var API_URL = 'https://arrive-receiver-krpvvyrncf.cn-hongkong.fcapp.run';   /* online-submission endpoint (Alibaba Function Compute, Hong Kong); leave empty to use the email-only flow */
var SUBMIT_TIMEOUT_MS = 20000;
function onlineOn(){ return !!API_URL && !(window.claude && window.claude.use); }
var DATA_BEGIN = '-----BEGIN ARRIVE-CHM DATA-----', DATA_END = '-----END ARRIVE-CHM DATA-----';
function b64(s){ var bytes = new TextEncoder().encode(s), bin = ''; for(var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin).replace(/(.{76})/g, '$1\n'); }
function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent || ''); }
function isMobileUA(){ var ua = navigator.userAgent || ''; return /Android|iPhone|iPad|iPod|HarmonyOS|OpenHarmony|Mobile/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function canShareFiles(){ try{ return !!(navigator.share && navigator.canShare && navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]})); }catch(e){ return false; } }
function payload(){
  var answers = ITEMS.map(function(it){ var a = store.answers[it.id] || {}; return {id:it.id, importance:(a.score!=null?a.score:null), cannotJudge:!!a.cj, note:(a.note||'').trim()}; });
  var rated = answers.filter(function(x){ return x.importance != null || x.cannotJudge; }).length;
  var suggestions = store.additions.filter(isFilled).map(function(a, i){
    return {no:i+1, kind:(a.anchor === 'outside' ? 'new' : 'extend'), anchor:a.anchor, anchorLabel:anchorLabel(a.anchor), requirement:(a.text||'').trim(), reason:(a.reason||'').trim()};
  });
  var profile = {}; Object.keys(store.profile).forEach(function(k){ profile[k] = store.profile[k]; });
  profile.name = (profile.name||'').trim(); profile.email = (profile.email||'').trim();
  return {schema:'arrive-chm-delphi-round1', schemaVersion:2, lang:S.lang, itemsVersion:D.version, scale:'1-9', exportedAt:new Date().toISOString(), totalItems:N, ratedCount:rated, complete:rated===N, profile:profile, answers:answers, suggestionsCount:suggestions.length, suggestions:suggestions};
}
function toText(p){
  var pr = p.profile || {}, L = [];
  L.push(S.tx.head(p.itemsVersion));
  L.push(S.tx.who(pr.name, pr.email));
  L.push(S.tx.grp(lblOf(GROUPS, pr.group), lblOf(FAM, pr.familiarity), pr.title, pr.years, pr.org));
  L.push(S.tx.sec((pr.secondary||[]).map(function(g){ return lblOf(GROUPS, g); }), BASIS.map(function(b){ var v = (pr.basis||{})[b[0]]; return [b[1], v ? lblOf(S.levels, v) : '']; })));
  L.push(S.tx.rated(p.ratedCount, p.totalItems, p.exportedAt));
  L.push('------');
  p.answers.forEach(function(a){ L.push(S.tx.ans(BY[a.id] ? qLabel(BY[a.id]) : a.id, a)); });
  S.tx.sections.forEach(function(g){
    var list = (p.suggestions||[]).filter(function(x){ return x.kind === g[0]; });
    L.push('------'); L.push(S.tx.count(g[1], list.length));
    list.forEach(function(x, i){
      L.push(S.tx.anchor(i+1, x.anchorLabel));
      L.push(S.tx.req(g[2], x.requirement));
      if(x.reason) L.push(S.tx.reason(x.reason));
    });
  });
  return L.join('\n');
}
function fileSafeName(s){
  s = String(s||''); try{ s = s.normalize('NFC'); }catch(e){}
  s = s.replace(/[\u0000-\u001f\u007f\\\/:*?"<>|#%&\s]+/g, '_').replace(/^[_.]+|[_.]+$/g, '');
  s = Array.from(s).slice(0, 24).join('').replace(/[_.]+$/g, '');
  return s || S.fileNoName;
}
function ymd(){ var d = new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function sigOf(p){
  var s = JSON.stringify({profile:p.profile, answers:p.answers, suggestions:p.suggestions}), h = 2166136261;
  for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16)+'-'+s.length;
}
function fmtLocal(iso){ var d = new Date(iso); return isNaN(d.getTime()) ? '' : d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function renderReceipt(){
  var el = document.getElementById('exprcpt'), b = document.getElementById('submitbtn'); if(!el) return;
  var r = onlineOn() ? store.receipt : null;
  if(!r){ el.hidden = true; el.innerHTML = ''; if(b && !submitting) b.textContent = S.submitBtn; return; }
  var changed = sigOf(payload()) !== r.sig;
  el.innerHTML = '<b class="rc-h">'+S.rcHead+'</b><div>'+S.rcBody(fmtLocal(r.at), esc(r.code || ''), r.rated, r.total, r.sug)+'</div>'
    + (changed ? '<div class="rc-warn">'+S.rcChanged+'</div>' : '<div class="rc-sub">'+S.rcAgain+'</div>');
  el.hidden = false;
  if(b && !submitting) b.textContent = S.resubmitBtn;
}
function setNote(msg){ var n = document.getElementById('expnote'); if(!n) return; n.textContent = msg || ''; n.hidden = !msg; }
async function submitOnline(p){
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null, tm = setTimeout(function(){ if(ctl) ctl.abort(); }, SUBMIT_TIMEOUT_MS);
  try{
    var res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(p), signal:ctl ? ctl.signal : undefined});
    var j = null; try{ j = await res.json(); }catch(e){}
    if(res.ok && j && j.ok === true) return {ok:true, id:j.id, receivedAt:j.receivedAt};
    return {ok:false, status:res.status, err:(j && j.error) ? String(j.error) : ''};
  }catch(e){ return {ok:false, status:0, err:'', aborted:!!(e && e.name === 'AbortError')}; }
  finally{ clearTimeout(tm); }
}
function setStatus(msg, err){ var s = document.getElementById('expstatus'); if(s){ s.textContent = msg; s.classList.toggle('err', !!err); } }
function showFallback(text){
  var f = document.getElementById('expfallback'); if(!f) return;
  f.hidden = false; f.innerHTML = '<textarea class="fallback" id="fbta" readonly></textarea>';
  var ta = document.getElementById('fbta'); ta.value = text; ta.focus(); ta.select();
}
async function saveFile(name, text, mime){
  var framed = !!(window.claude && window.claude.use);
  if(framed){
    try{ var dl = await window.claude.use('downloads'); if(dl){ await dl.save({filename:name, data:text}); return 'saved'; } }
    catch(e){ if(e && e.code === 'declined') return 'declined'; }
    return 'unsupported';
  }
  try{
    var blob = new Blob([text], {type:mime}), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000); return 'saved';
  }catch(e){ return 'failed'; }
}
function needProfile(){
  var p = store.profile;
  if((p.name||'').trim() && validEmail(p.email)) return false;
  setStatus(S.needProfile, true);
  var box = document.getElementById('pfbox'); if(box){ box.open = true; scrollToEl('pfbox'); }
  return true;
}
var lastMail = null, flashTimers = {}, submitting = false;
function flashBtn(btn, ok){
  if(!btn) return;
  if(btn.dataset.lbl === undefined) btn.dataset.lbl = btn.textContent;
  btn.textContent = ok ? S.mcCopied : S.mcCopyFail;
  clearTimeout(flashTimers[btn.dataset.exp]); flashTimers[btn.dataset.exp] = setTimeout(function(){ btn.textContent = btn.dataset.lbl; }, 2200);
}
function showMailCard(m){
  var c = document.getElementById('expcard'); if(!c) return;
  c.innerHTML = '<b class="mc-h">'+S.mcHead+'</b><ol>'
    + '<li>'+S.mcLi1(esc(m.base)+'.json')+'</li>'
    + '<li>'+S.mcLi2
    +   '<div class="mc-row"><span class="k">'+S.mcTo+'</span><b>'+esc(m.addr)+'</b><button class="btn small" type="button" data-exp="copyaddr">'+S.mcCopy+'</button></div>'
    +   '<div class="mc-row"><span class="k">'+S.mcSubj+'</span><b>'+esc(m.subject)+'</b><button class="btn small" type="button" data-exp="copysubj">'+S.mcCopy+'</button></div>'
    +   '<div class="mc-row"><span class="k">'+S.mcBodyLbl+'</span><span>'+S.mcBodyHint+'</span><button class="btn small" type="button" data-exp="copybody">'+S.mcCopy+'</button></div></li>'
    + '<li>'+S.mcLi3+'</li></ol>'
    + '<div class="mc-act"><a class="btn small" href="'+esc(m.href)+'">'+S.mcRetry+'</a><button class="btn small" type="button" data-exp="redl">'+S.mcRedl+'</button></div>';
  c.hidden = false;
  try{ c.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'nearest'}); }catch(e){}
}
async function doExport(kind, btn){
  if(kind === 'copyaddr'){
    var ok0 = false; try{ await navigator.clipboard.writeText(RETURN_EMAIL); ok0 = true; }catch(e){}
    if(btn && btn.closest && btn.closest('#expcard')) flashBtn(btn, ok0);
    setStatus(ok0 ? S.copiedMail(RETURN_EMAIL) : S.copyMailFail, !ok0); return;
  }
  if(kind === 'copysubj' || kind === 'copybody'){
    if(!lastMail) return;
    var ok1 = false; try{ await navigator.clipboard.writeText(kind === 'copysubj' ? lastMail.subject : lastMail.body); ok1 = true; }catch(e){}
    flashBtn(btn, ok1); setStatus(ok1 ? S.copiedPart(kind === 'copysubj' ? S.mcSubj : S.mcBodyLbl) : S.copyMailFail, !ok1); return;
  }
  if(kind === 'redl'){
    if(!lastMail) return;
    var rr = await saveFile(lastMail.base+'.json', lastMail.json, 'application/json');
    setStatus(rr === 'saved' ? S.redlOk(lastMail.base) : (rr === 'declined' ? S.saveDeclined : S.saveFailed), rr !== 'saved'); return;
  }
  if(needProfile()) return;
  if(kind === 'submit' && submitting) return;
  var p = payload(), d = new Date();
  var base = fileSafeName(p.profile.name)+'_'+S.fileTag+'_'+ymd()+'-'+pad(d.getHours())+pad(d.getMinutes());
  var json = JSON.stringify(p, null, 2);
  var note = S.noteTail(N-p.ratedCount, p.suggestionsCount);
  if(kind === 'copy'){
    var txt = toText(p) + '\n\n' + DATA_BEGIN + '\n' + b64(JSON.stringify(p)) + '\n' + DATA_END + '\n' + S.dataNote, ok = false;
    try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
    if(ok){ setStatus(S.copiedText(note)); document.getElementById('expfallback').hidden = true; }
    else { setStatus(S.copyFail(note)); showFallback(txt); }
    return;
  }
  setNote('');
  if(kind === 'submit' && onlineOn()){
    submitting = true;
    var sb = document.getElementById('submitbtn');
    if(sb){ sb.disabled = true; sb.textContent = S.sendingBtn; }
    setStatus(S.sending);
    var res = await submitOnline(p);
    submitting = false;
    if(sb) sb.disabled = false;
    if(res.ok){
      var mm = /([0-9a-f]{8})$/i.exec(String(res.id || ''));
      store.receipt = {id:String(res.id || ''), code:(mm ? mm[1] : String(res.id || '').slice(-8)).toUpperCase(), at:res.receivedAt || new Date().toISOString(), sig:sigOf(p), rated:p.ratedCount, total:N, sug:p.suggestionsCount};
      try{ localStorage.setItem(KEY, JSON.stringify(store)); canStore = true; }catch(e){ canStore = false; }
      setStatus('');
      var c0 = document.getElementById('expcard'), f0 = document.getElementById('expfallback');
      if(c0){ c0.hidden = true; c0.innerHTML = ''; } if(f0){ f0.hidden = true; f0.innerHTML = ''; }
      renderReceipt();
      var rc = document.getElementById('exprcpt');
      try{ if(rc) rc.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'nearest'}); }catch(e){}
      return;
    }
    renderReceipt();
    setNote(S.sendFail(res.status >= 400 && res.status < 500 ? res.err : ''));
    kind = 'submitmail';
  }
  if(kind === 'submit' || kind === 'submitmail'){
    if(!RETURN_EMAIL) kind = 'json';
    else if(isMobileUA() && canShareFiles()){
      var cp = Promise.resolve(false);
      try{ cp = navigator.clipboard.writeText(RETURN_EMAIL).then(function(){ return true; }, function(){ return false; }); }catch(e){}
      try{
        await navigator.share({files:[new File([json], base+'.json', {type:'application/json'})], title:S.shareTitle(p.profile.name), text:S.shareText(p.profile.name)});
        var copied = await cp;
        setStatus(S.shareOpened(RETURN_EMAIL, copied, note));
        return;
      }catch(e){
        if(e && e.name === 'AbortError'){ setStatus(S.shareCancelSubmit); return; }
        kind = 'mail';
      }
    } else kind = 'mail';
  }
  if(kind === 'share'){
    try{
      await navigator.share({files:[new File([json], base+'.json', {type:'application/json'})], title:S.share2Title, text:S.share2Text(p.profile.name)});
      setStatus(S.share2Opened(note));
    }catch(e){
      if(e && e.name === 'AbortError') setStatus(S.share2Cancel);
      else setStatus(S.share2Fail, true);
    }
    return;
  }
  if(kind === 'mail'){
    var rm = await saveFile(base+'.json', json, 'application/json');
    if(rm !== 'saved'){ setStatus(rm === 'declined' ? S.saveDeclined : S.saveFailed, true); return; }
    var subj = S.mailSubject(p.profile.name), bodyTxt = S.mailBody(base, p.profile.name);
    var href = 'mailto:'+RETURN_EMAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(bodyTxt);
    lastMail = {base:base, json:json, addr:RETURN_EMAIL, subject:subj, body:bodyTxt, href:href};
    var a = document.createElement('a');
    a.href = href;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(S.mailStatus(base, RETURN_EMAIL, note));
    showMailCard(lastMail);
    return;
  }
  var r = await saveFile(base+'.json', json, 'application/json');
  if(r === 'saved') setStatus(onlineOn() ? S.fileMadeOnline(base, RETURN_EMAIL, note) : S.fileMade(base, RETURN_EMAIL, note));
  else if(r === 'declined') setStatus(S.saveDeclined);
  else { setStatus(S.noDownload, true); }
}
var resetArmed = false, resetTimer = null;

}
